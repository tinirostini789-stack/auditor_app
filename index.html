<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuditStock Pro Workspace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- XLSX Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- HTML5 QR & Barcode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = 'https://kfnlmryobtyovvnrscfv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EaBvbXs2xCsVC0n7xlbK2g__WjqLbG0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const INITIAL_MASTER_STOCK = [
      { id: '1', name: 'Sepatu Running Speed', color: 'Merah', size: '42', skuInduk: 'SKU-RUN-SPD', sku: 'SKU-RUN-SPD-RED-42', salesPerMonth: 120, movingCategory: 'Fast Moving', price: 550000, priceCategory: 'Medium Value', zone: 'Lantai 1', systemQty: 120, conversionRatio: 50 },
      { id: '2', name: 'Tas BackPack Travel', color: 'Hitam', size: '30L', skuInduk: 'SKU-BAG-TRV', sku: 'SKU-BAG-TRV-BLK-30L', salesPerMonth: 15, movingCategory: 'Slow Moving', price: 1850000, priceCategory: 'High Value', zone: 'Lantai 2', systemQty: 250, conversionRatio: 50 },
      { id: '3', name: 'Kasur Genoa Florence', color: 'Putih', size: '150x200', skuInduk: 'Kasur-M24', sku: 'Kasur-M24-150x200-FLORENCE-Genoa-(PT)', salesPerMonth: 275, movingCategory: 'Fast Moving', price: 4200000, priceCategory: 'High Value', zone: 'Lantai 3', systemQty: 500, conversionRatio: 1 }
    ];

    const DEFAULT_ACCOUNTS = [
      { key: 'koordinator', name: 'Koordinator (Bahrudin)', role: 'koordinator', pass: 'admin123' },
      { key: 'auditor1', name: 'Auditor 1', role: 'auditor', pass: 'auditor123' },
      { key: 'auditor2', name: 'Auditor 2', role: 'auditor', pass: 'auditor123' },
      { key: 'qc', name: 'Checker / QC', role: 'qc', pass: 'qc123' }
    ];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState('');
      const [currentRole, setCurrentRole] = useState(''); 
      const [loginInputKey, setLoginInputKey] = useState('koordinator');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [accounts, setAccounts] = useState(DEFAULT_ACCOUNTS);
      const [editAccountState, setEditAccountState] = useState({});

      const [newAccName, setNewAccName] = useState('');
      const [newAccRole, setNewAccRole] = useState('auditor');
      const [newAccPass, setNewAccPass] = useState('');

      const [activeTab, setActiveTab] = useState('opname');
      const [masterStock, setMasterStock] = useState(INITIAL_MASTER_STOCK);
      const [auditLogs, setAuditLogs] = useState([]);
      const [actionHistory, setActionHistory] = useState([]); 
      const [importHistory, setImportHistory] = useState([]); 
      const [exportSubTab, setExportSubTab] = useState('upload'); 

      const [todos, setTodos] = useState([]);
      const [todoPeriod, setTodoPeriod] = useState('Harian');
      const [todoPrioritySort, setTodoPrioritySort] = useState('DESC');
      
      const [taskTitle, setTaskTitle] = useState('');
      const [taskDesc, setTaskDesc] = useState('');
      const [taskPriority, setTaskPriority] = useState('High');
      const [taskDueDate, setTaskDueDate] = useState('');
      const [taskCategory, setTaskCategory] = useState('Harian');
      const [taskAssignedTo, setTaskAssignedTo] = useState('Semua Tim');

      const [importMode, setImportMode] = useState('master');
      const [dbStatus, setDbStatus] = useState('Menghubungkan ke Cloud...');

      const [isProcessingFile, setIsProcessingFile] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);
      const [uploadStatusMsg, setUploadStatusMsg] = useState('');

      // State Zonasi (Lantai 1 - 15 & Gedung GCK, CM, UKM)
      const [selectedZone, setSelectedZone] = useState('Lantai 1');
      const [customZone, setCustomZone] = useState('');
      const [selectedBuildings, setSelectedBuildings] = useState({ GCK: false, CM: false, UKM: false });

      const [skuInput, setSkuInput] = useState('');
      const [selectedSkuObj, setSelectedSkuObj] = useState(null);
      const [inputQty, setInputQty] = useState('');
      const [unit, setUnit] = useState('Pcs');
      const [conversionRatio, setConversionRatio] = useState(50);
      const [auditorNote, setAuditorNote] = useState('');
      const [showSuggestions, setShowSuggestions] = useState(false);

      // Camera Scanner State for Opname
      const [isScannerOpen, setIsScannerOpen] = useState(false);

      const [dashboardSearch, setDashboardSearch] = useState('');
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
      const [dashboardPage, setDashboardPage] = useState(1);
      const ITEMS_PER_PAGE = 100;

      // State Quick Edit Qty System di Dashboard
      const [editingSku, setEditingSku] = useState(null);
      const [tempQtyValue, setTempQtyValue] = useState('');

      // State Bulk Selection Audit Logs
      const [selectedLogIds, setSelectedLogIds] = useState([]);

      // State Search Bar Opname Record Table & Per-SKU Edit Modal
      const [opnameTableSearch, setOpnameTableSearch] = useState('');
      const [editingOpnameLog, setEditingOpnameLog] = useState(null);
      const [editLogSku, setEditLogSku] = useState('');
      const [editLogQty, setEditLogQty] = useState('');
      const [editLogZone, setEditLogZone] = useState('');

      // Auto-lookup Nama Produk ketika Kode SKU diubah di Modal Edit
      const editLogAutoName = useMemo(() => {
        if (!editLogSku) return '';
        const found = masterStock.find(m => m.sku.toLowerCase() === editLogSku.trim().toLowerCase());
        return found ? found.name : 'SKU Non-Master / Item Baru';
      }, [editLogSku, masterStock]);

      // Auto Reset Gedung kembali ke Default (Belum dicentang) setiap kelipatan 200 record SO
      useEffect(() => {
        if (auditLogs.length > 0 && auditLogs.length % 200 === 0) {
          setSelectedBuildings({ GCK: false, CM: false, UKM: false });
        }
      }, [auditLogs.length]);

      // Fetch Initial Data & Subscribe Realtime
      useEffect(() => {
        fetchCloudData();

        let channel;
        try {
          channel = supabase
            .channel('public:audit_logs_channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'audit_logs' }, () => {
              fetchAuditLogs();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'master_skus' }, () => {
              fetchCloudData();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'audit_todos' }, () => {
              fetchTodosOnly();
            })
            .subscribe();
        } catch (err) {
          console.warn('Realtime subscription warning:', err);
        }

        return () => {
          if (channel) {
            try {
              supabase.removeChannel(channel);
            } catch (e) {}
          }
        };
      }, []);

      // Handle Barcode/QR Scanner Lifecycle
      useEffect(() => {
        let html5QrCode = null;
        if (isScannerOpen) {
          const timer = setTimeout(() => {
            try {
              if (window.Html5Qrcode) {
                html5QrCode = new window.Html5Qrcode("qr-reader");
                html5QrCode.start(
                  { facingMode: "environment" },
                  { fps: 10, qrbox: { width: 250, height: 150 } },
                  (decodedText) => {
                    const cleanCode = decodedText.trim();
                    setSkuInput(cleanCode);
                    const matched = masterStock.find(m => m.sku.toLowerCase() === cleanCode.toLowerCase());
                    if (matched) {
                      setSelectedSkuObj(matched);
                      setConversionRatio(matched.conversionRatio || 50);
                      setShowSuggestions(false);
                    } else {
                      setSelectedSkuObj(null);
                      setShowSuggestions(true);
                    }
                    setIsScannerOpen(false);
                  },
                  () => {}
                ).catch((err) => {
                  console.warn("Kamera tidak dapat diakses:", err);
                });
              }
            } catch (e) {
              console.error("Scanner init error:", e);
            }
          }, 250);

          return () => {
            clearTimeout(timer);
            if (html5QrCode && html5QrCode.isScanning) {
              html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
            }
          };
        }
      }, [isScannerOpen, masterStock]);

      const handleOpenEditModal = (log) => {
        if (currentRole === 'qc') {
          alert('Akun QC tidak diizinkan merubah data record opname.');
          return;
        }
        if (currentRole === 'auditor' && currentUser.toLowerCase() !== log.auditorName.toLowerCase()) {
          alert('Auditor hanya diizinkan mengedit record miliknya sendiri!');
          return;
        }
        setEditingOpnameLog(log);
        setEditLogSku(log.sku);
        setEditLogQty(log.inputQty);
        setEditLogZone(log.zone);
      };

      const handleSaveOpnameLogEdit = async (e) => {
        e.preventDefault();
        if (!editingOpnameLog) return;
        
        const newQty = parseFloat(editLogQty);
        if (isNaN(newQty) || newQty <= 0) {
          alert('Mohon masukkan Qty SO yang valid!');
          return;
        }

        const matchedMaster = masterStock.find(m => m.sku.toLowerCase() === editLogSku.trim().toLowerCase());
        const updatedName = matchedMaster ? matchedMaster.name : 'SKU Non-Master / Item Baru';
        const ratio = editingOpnameLog.conversionRatio || 50;
        const newPcsQty = editingOpnameLog.unit === 'Koli' ? newQty * ratio : newQty;
        const newKoliQty = editingOpnameLog.unit === 'Koli' ? newQty : newQty / ratio;

        setAuditLogs(prev => prev.map(l => l.id === editingOpnameLog.id ? {
          ...l,
          sku: editLogSku.trim(),
          name: updatedName,
          inputQty: newQty,
          zone: editLogZone,
          pcsQty: newPcsQty,
          koliQty: newKoliQty
        } : l));

        await logActionHistory('EDIT_RECORD_OPNAME', editLogSku, `Edit Record ID ${editingOpnameLog.id}: Qty ${newQty} ${editingOpnameLog.unit}, Zone: ${editLogZone}`);

        try {
          await supabase.from('audit_logs').update({
            sku: editLogSku.trim(),
            name: updatedName,
            input_qty: newQty,
            zone: editLogZone,
            pcs_qty: newPcsQty,
            karung_qty: newKoliQty
          }).eq('id', editingOpnameLog.id);
          
          setEditingOpnameLog(null);
          alert('Record Opname berhasil diperbarui!');
          await fetchAuditLogs();
        } catch (err) {
          console.error('Gagal update record opname:', err);
          alert('Gagal memperbarui data di cloud database.');
        }
      };

      const filteredAuditLogs = useMemo(() => {
        if (!opnameTableSearch.trim()) return auditLogs;
        const tokens = opnameTableSearch.toLowerCase().trim().split(/\s+/);
        return auditLogs.filter(log => {
          const target = (log.sku + ' ' + log.name + ' ' + log.zone + ' ' + log.inputQty + ' ' + log.unit + ' ' + log.auditorName + ' ' + (log.note || '')).toLowerCase();
          return tokens.every(token => target.includes(token));
        });
      }, [auditLogs, opnameTableSearch]);

      const handleDownloadEditSOStoreTemplate = () => {
        const headers = ['Record ID', 'Gedung & Lantai', 'SKU Variasi', 'Nama Product', 'Qty SO (Pcs)'];
        const rows = auditLogs.map(l => [l.id, l.zone, l.sku, l.name, l.pcsQty]);
        downloadNativeExcel('Edit SO Massal', headers, rows, 'Template_SO_Edit_Massal.xlsx');
      };

      const logActionHistory = async (type, sku, details) => {
        const timestamp = new Date().toLocaleString('id-ID');
        const historyId = Date.now().toString() + Math.random().toString(36).substr(2, 4);
        const newHistoryItem = {
          id: historyId,
          timestamp,
          actor: currentUser || 'System',
          role: currentRole || 'koordinator',
          type,
          sku,
          details
        };
        setActionHistory(prev => [newHistoryItem, ...prev]);

        try {
          await supabase.from('audit_action_histories').insert([{
            id: historyId,
            timestamp,
            actor: currentUser || 'System',
            role: currentRole || 'koordinator',
            type,
            sku,
            details
          }]);
        } catch (err) {
          console.error('Gagal menyimpan action history ke cloud:', err);
        }
      };

      const fetchTodosOnly = async () => {
        try {
          const { data: todoData, error } = await supabase.from('audit_todos').select('*');
          if (!error && todoData) {
            setTodos(todoData.map(t => ({
              id: t.id,
              title: t.title,
              description: t.description,
              priority: t.priority,
              period: t.period,
              dueDate: t.due_date,
              assignedTo: t.assigned_to,
              completed: t.completed
            })));
          }
        } catch (e) {}
      };

      const fetchAuditLogs = async () => {
        try {
          const { data: logData, error: logError } = await supabase.from('audit_logs').select('*');
          if (logError) {
            console.error('Gagal mengambil audit logs:', logError.message);
            return;
          }
          if (logData) {
            const formattedLogs = logData.map(log => ({
              id: String(log.id),
              timestamp: log.timestamp || new Date().toLocaleString('id-ID'),
              zone: log.zone || 'Lantai 1',
              sku: log.sku,
              name: log.name || 'SKU Item',
              inputQty: parseFloat(log.input_qty) || 0,
              unit: log.unit || 'Pcs',
              pcsQty: parseFloat(log.pcs_qty) || 0,
              koliQty: parseFloat(log.karung_qty) || 0,
              conversionRatio: parseFloat(log.conversion_ratio) || 50,
              systemQty: parseFloat(log.system_qty) || 0,
              note: log.auditor_note || '',
              auditorName: log.auditor_name || 'System / Umum',
              qcName: log.qc_name || '-',
              accStatus: log.acc_status || 'PENDING',
              accBy: log.acc_by || '-'
            }));
            formattedLogs.sort((a, b) => Number(b.id) - Number(a.id));
            setAuditLogs(formattedLogs);
          }
        } catch (err) {
          console.error('Error fetchAuditLogs:', err);
        }
      };

      // ROBUST UNLIMITED CHUNK FETCHING FOR UP TO 100,000 SKUs (Ensuring full data recovery)
      const fetchCloudData = async () => {
        try {
          setDbStatus('Memuat seluruh SKU cloud (Hingga 100k SKU)...');
          
          const { data: accData, error: accError } = await supabase.from('app_accounts').select('*');
          if (!accError && accData && accData.length > 0) {
            const formattedAccs = accData.map(a => ({
              key: a.account_key,
              name: a.account_name,
              role: a.role,
              pass: a.password
            }));
            setAccounts(formattedAccs);
            const initialEdits = {};
            formattedAccs.forEach(a => { initialEdits[a.key] = { name: a.name, pass: '' }; });
            setEditAccountState(initialEdits);
          } else {
            for (const acc of DEFAULT_ACCOUNTS) {
              await supabase.from('app_accounts').upsert({
                account_key: acc.key, account_name: acc.name, role: acc.role, password: acc.pass
              }, { onConflict: 'account_key' });
            }
          }

          await fetchTodosOnly();

          // Full pagination loop fetching all records in chunks of 1000 (Supabase API max_rows limit) up to 100k items
          let allSkuData = [];
          let rangeStart = 0;
          const rangeStep = 1000;
          let fetchMore = true;

          while (fetchMore && rangeStart < 100000) {
            const { data: skuDataChunk, error: skuError, count } = await supabase
              .from('master_skus')
              .select('*', { count: 'exact' })
              .order('sku', { ascending: true })
              .range(rangeStart, rangeStart + rangeStep - 1);
            
            if (skuError || !skuDataChunk || skuDataChunk.length === 0) {
              fetchMore = false;
            } else {
              allSkuData = allSkuData.concat(skuDataChunk);
              setDbStatus(`Memuat SKU: ${allSkuData.length.toLocaleString()}${count ? ' / ' + count.toLocaleString() : ''}...`);
              if (count !== null && allSkuData.length >= count) {
                fetchMore = false;
              } else if (skuDataChunk.length < rangeStep) {
                fetchMore = false;
              } else {
                rangeStart += rangeStep;
              }
            }
          }

          if (allSkuData.length > 0) {
            const formattedSkus = allSkuData.map((s, idx) => ({
              id: s.id || String(idx + 1),
              name: s.name || s.sku,
              color: s.color || '-',
              size: s.size || '-',
              skuInduk: s.sku_induk || s.sku,
              sku: s.sku,
              salesPerMonth: parseFloat(s.sales_per_month) || 0,
              movingCategory: s.moving_category || 'Fast Moving',
              price: parseFloat(s.price) || 0,
              priceCategory: s.price_category || 'Medium Value',
              zone: s.zone || 'Lantai 1',
              systemQty: parseFloat(s.system_qty) || 0,
              conversionRatio: parseFloat(s.conversion_ratio) || 50
            }));
            setMasterStock(formattedSkus);
          }

          const { data: histData, error: histError } = await supabase.from('audit_action_histories').select('*');
          if (!histError && histData) {
            setActionHistory(histData.sort((a, b) => Number(b.id) - Number(a.id)));
          }

          const { data: impData, error: impError } = await supabase.from('import_file_histories').select('*');
          if (!impError && impData) {
            setImportHistory(impData.sort((a, b) => Number(b.id) - Number(a.id)));
          }

          await fetchAuditLogs();
          setDbStatus('Terhubung ke Cloud Supabase');
        } catch (err) {
          console.error('Supabase fetch error:', err);
          setDbStatus('Mode Lokal (Offline)');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const foundAccount = accounts.find(a => a.key === loginInputKey);
        if (!foundAccount) {
          setLoginError('Akun tidak ditemukan.');
          return;
        }
        if (loginPassword === foundAccount.pass) {
          setIsLoggedIn(true);
          setCurrentUser(foundAccount.name);
          setCurrentRole(foundAccount.role);
          setLoginError('');
          setActiveTab('opname');
        } else {
          setLoginError('Password salah! Silakan cek kembali.');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setCurrentUser('');
        setCurrentRole('');
        setLoginPassword('');
        setSelectedLogIds([]);
      };

      const handleAddAccount = async (e) => {
        e.preventDefault();
        if (accounts.length >= 10) {
          alert('Maksimal 10 akun pengguna telah tercapai!');
          return;
        }
        if (!newAccName.trim() || !newAccPass.trim()) {
          alert('Nama akun dan password wajib diisi!');
          return;
        }
        const newKey = 'user_' + Date.now();
        const newAcc = {
          key: newKey,
          name: newAccName.trim(),
          role: newAccRole,
          pass: newAccPass.trim()
        };

        setAccounts(prev => [...prev, newAcc]);
        setEditAccountState(prev => ({ ...prev, [newKey]: { name: newAcc.name, pass: '' } }));
        setNewAccName('');
        setNewAccPass('');

        try {
          await supabase.from('app_accounts').insert([{
            account_key: newAcc.key,
            account_name: newAcc.name,
            role: newAcc.role,
            password: newAcc.pass
          }]);
          alert('Akun baru berhasil ditambahkan!');
        } catch (err) {
          console.error('Gagal menambah akun ke cloud:', err);
        }
      };

      const handleDeleteAccount = async (key) => {
        if (key === 'koordinator') {
          alert('Akun Koordinator utama tidak dapat dihapus!');
          return;
        }
        if (!window.confirm('Yakin ingin menghapus akun ini?')) return;
        setAccounts(prev => prev.filter(a => a.key !== key));
        try {
          await supabase.from('app_accounts').delete().eq('account_key', key);
        } catch (err) {
          console.error('Gagal menghapus akun di cloud:', err);
        }
      };

      const handleSaveAccountSettings = async (key) => {
        const editObj = editAccountState[key];
        if (!editObj) return;
        const targetAcc = accounts.find(a => a.key === key);
        if (!targetAcc) return;

        const updatedName = editObj.name.trim() || targetAcc.name;
        const updatedPass = editObj.pass.trim() || targetAcc.pass;

        setAccounts(prev => prev.map(a => a.key === key ? { ...a, name: updatedName, pass: updatedPass } : a));
        setEditAccountState(prev => ({ ...prev, [key]: { name: updatedName, pass: '' } }));
        
        if (currentUser === targetAcc.name) {
          setCurrentUser(updatedName);
        }

        try {
          await supabase.from('app_accounts').upsert({
            account_key: key,
            account_name: updatedName,
            role: targetAcc.role,
            password: updatedPass
          }, { onConflict: 'account_key' });
          alert(`Pengaturan akun ${updatedName} berhasil disimpan!`);
        } catch (err) {
          alert('Gagal menyimpan perubahan ke cloud.');
        }
      };

      const handleQuickSaveQty = async (sku) => {
        const parsedQty = parseFloat(tempQtyValue);
        if (isNaN(parsedQty) || parsedQty < 0) {
          alert('Masukkan angka Qty System yang valid!');
          return;
        }

        setMasterStock(prev => prev.map(item => item.sku === sku ? { ...item, systemQty: parsedQty } : item));
        setEditingSku(null);

        await logActionHistory('UPDATE_SYSTEM_QTY', sku, `Ubah Qty System menjadi ${parsedQty} Pcs via Dashboard`);

        try {
          await supabase.from('master_skus').update({ system_qty: parsedQty }).eq('sku', sku);
        } catch (err) {
          console.error('Gagal update system_qty di cloud:', err);
        }
      };

      const handleCreateTask = async (e) => {
        e.preventDefault();
        if (!taskTitle.trim()) {
          alert('Nama task wajib diisi!');
          return;
        }
        const newTodo = {
          id: Date.now().toString(),
          title: taskTitle.trim(),
          description: taskDesc.trim() || '-',
          priority: taskPriority,
          period: taskCategory,
          dueDate: taskDueDate || new Date().toISOString().split('T')[0],
          assignedTo: taskAssignedTo,
          completed: false
        };

        setTodos(prev => [newTodo, ...prev]);
        setTaskTitle('');
        setTaskDesc('');
        setTaskDueDate('');

        try {
          await supabase.from('audit_todos').insert([{
            id: newTodo.id,
            title: newTodo.title,
            description: newTodo.description,
            priority: newTodo.priority,
            period: newTodo.period,
            due_date: newTodo.dueDate,
            assigned_to: newTodo.assignedTo,
            completed: false
          }]);
        } catch (err) {
          console.error('Gagal menyimpan todo ke cloud:', err);
        }
      };

      const handleToggleTask = async (id, currentStatus) => {
        const updated = !currentStatus;
        setTodos(prev => prev.map(t => t.id === id ? { ...t, completed: updated } : t));
        try {

      // Fuzzy Multi-Keyword Non-Sequential Search for Opname SKU

            pcs: pcs,
            koli: num,

      const handleAddAuditRecord = async (e) => {

      const handleQcUpdate = async (id, currentQc, sku) => {

      const handleDeleteAuditLog = async (id, auditorName, sku) => {

        }

      // Bulk Checkbox Selection & Delete Handlers

      const handleBulkDeleteLogs = async () => {

        let idsToDelete = [...selectedLogIds];

        } catch (err) {
          console.error('Exception saat bulk delete:', err);
        }
      };

      // Reconciliation data memoized with non-sequential multi-keyword search
      const reconciliationData = useMemo(() => {
        const physicalMap = {};
        auditLogs.forEach(log => {
          physicalMap[log.sku] = (physicalMap[log.sku] || 0) + log.pcsQty;
        });

        let totalSystemPcs = 0;
        let totalAuditedPcs = 0;
        let totalDiscrepanciesCount = 0;

        const allItems = masterStock.map(item => {
          const physicalQty = physicalMap[item.sku] || 0;
          const discrepancyPcs = physicalQty - item.systemQty;
          const status = discrepancyPcs === 0 ? 'MATCHED' : discrepancyPcs < 0 ? 'SHORTAGE' : 'OVERSTOCK';
          
          totalSystemPcs += item.systemQty;
          totalAuditedPcs += physicalQty;
          if (discrepancyPcs !== 0) totalDiscrepanciesCount++;

          return {
            ...item,
            physicalQty,
            discrepancyPcs,
            status
          };
        });

        let filtered = allItems;
        if (dashboardSearch.trim()) {
          const tokens = dashboardSearch.toLowerCase().trim().split(/\s+/);
          filtered = allItems.filter(item => {
            const target = (item.sku + ' ' + item.name + ' ' + item.color + ' ' + item.size + ' ' + item.status).toLowerCase();
            return tokens.every(token => target.includes(token));
          });
        }

        if (sortConfig.key) {
          filtered = [...filtered].sort((a, b) => {
            let valA = a[sortConfig.key];
            let valB = b[sortConfig.key];
            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();
            if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
            if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }

        const totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
        const safePage = Math.min(dashboardPage, totalPages);
        const startIndex = (safePage - 1) * ITEMS_PER_PAGE;
        const paginatedItems = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

        return {
          items: paginatedItems,
          totalItemsCount: filtered.length,
          totalPages,
          totalSkusCount: masterStock.length,
          totalSystemPcs,
          totalAuditedPcs,
          netDiscrepancy: totalAuditedPcs - totalSystemPcs,
          totalDiscrepanciesCount
        };
      }, [masterStock, auditLogs, dashboardSearch, sortConfig, dashboardPage]);

      const handleSort = (key) => {
        setSortConfig(prev => ({
          key,
          direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
        }));
      };

      const downloadNativeExcel = (sheetName, headers, rows, fileName) => {
        if (!window.XLSX) return;
        const aoaData = [headers, ...rows];
        const ws = window.XLSX.utils.aoa_to_sheet(aoaData);
        ws['!cols'] = headers.map((h, i) => ({ wch: Math.max(String(h).length + 6, 18) }));
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, sheetName);
        window.XLSX.writeFile(wb, fileName);
      };

      const handleDownloadMasterTemplate = () => {
        const headers = ['Nama Product', 'Warna', 'Ukuran', 'SKU Induk', 'SKU Variasi', 'Sales/Bulan', 'Kategori Moving', 'Harga', 'Kategori Harga'];
        const rows = [['Contoh Baju', 'Hitam', 'XL', 'BJ-001', 'BJ-001-BLK-XL', 150, 'Fast Moving', 250000, 'Medium Value']];
        downloadNativeExcel('Template Master', headers, rows, 'Template_Master_Data.xlsx');
      };

      const handleDownloadQtyTemplate = () => {
        const headers = ['SKU Variasi', 'Nama Product', 'System Qty (Pcs)'];
        const rows = masterStock.map(item => [item.sku, item.name, item.systemQty]);
        downloadNativeExcel('Update Qty', headers, rows, 'Template_Qty_Stok.xlsx');
      };

      const handleDownloadMasterSyncTemplate = () => {
        const headers = ['Nama Product', 'Warna', 'Ukuran', 'SKU Induk', 'SKU Variasi', 'Sales/Bulan', 'Kategori Moving', 'Harga', 'Kategori Harga'];
        const rows = masterStock.map(item => [item.name, item.color, item.size, item.skuInduk, item.sku, item.salesPerMonth, item.movingCategory, item.price, item.priceCategory]);
        downloadNativeExcel('Sync Master', headers, rows, 'Template_Sync_Master.xlsx');
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessingFile(true);
        setUploadProgress(5);
        setUploadStatusMsg('Membaca file Excel di browser...');

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = window.XLSX.read(bstr, { type: 'binary' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const data = window.XLSX.utils.sheet_to_json(ws);

            if (data.length === 0) {
              alert('File kosong!');
              setIsProcessingFile(false);
              return;
            }

            setUploadProgress(15);
            setUploadStatusMsg(`Memvalidasi ${data.length.toLocaleString()} baris data...`);

            const cleanNum = (val) => {
              if (val === undefined || val === null || val === '') return 0;
              if (typeof val === 'number') return val;
              const numStr = String(val).replace(/[^0-9.-]/g, '');
              return parseFloat(numStr) || 0;
            };

            const timestampStr = new Date().toLocaleString('id-ID');
            const impId = Date.now().toString();
            const modeLabel = importMode === 'master' ? '1. Import Master' : importMode === 'qty' ? '2. Import Qty Stok' : importMode === 'sync_delete' ? '3. Sync & Hapus SKU' : '4. Import Edit SO Massal';

            setImportHistory(prev => [{
              id: impId,
              timestamp: timestampStr,
              fileName: file.name,
              mode: modeLabel,
              uploader: currentUser
            }, ...prev]);

            try {
              await supabase.from('import_file_histories').insert([{
                id: impId,
                timestamp: timestampStr,
                file_name: file.name,
                mode: modeLabel,
                uploader: currentUser
              }]);
            } catch (err) {}

            if (importMode === 'edit_so_massal') {
              let updatedCount = 0;
              for (const row of data) {
                const recordId = String(row['Record ID'] || row['id'] || '').trim();
                const newZone = String(row['Gedung & Lantai'] || row['Zone'] || '').trim();
                const newSku = String(row['SKU Variasi'] || row['SKU'] || '').trim();
                const newQtyPcs = cleanNum(row['Qty SO (Pcs)'] || row['Qty SO']);

                if (recordId) {
                  const targetLog = auditLogs.find(l => l.id === recordId);
                  if (targetLog) {
                    const matchedMaster = masterStock.find(m => m.sku.toLowerCase() === (newSku || targetLog.sku).toLowerCase());
                    const updatedName = matchedMaster ? matchedMaster.name : targetLog.name;
                    const ratio = targetLog.conversionRatio || 50;
                    const updatedKoli = newQtyPcs / ratio;

                    await supabase.from('audit_logs').update({
                      zone: newZone || targetLog.zone,
                      sku: newSku || targetLog.sku,
                      name: updatedName,
                      pcs_qty: newQtyPcs,
                      input_qty: targetLog.unit === 'Koli' ? updatedKoli : newQtyPcs,
                      karung_qty: updatedKoli
                    }).eq('id', recordId);
                    updatedCount++;
                  }
                }
              }

              await logActionHistory('IMPORT_EDIT_SO_MASSAL', `${updatedCount} Record`, `Upload file edit massal (${file.name})`);
              await fetchAuditLogs();
              setUploadProgress(100);
              setTimeout(() => {
                setIsProcessingFile(false);
                alert(`Berhasil memperbarui ${updatedCount} baris record SO dari file Excel!`);
              }, 300);
              return;
            }

            if (importMode === 'qty') {
              const qtyMap = new Map();
              data.forEach(row => {
                const skuVal = String(row['SKU Variasi'] || row['SKU'] || row['sku'] || '').trim();
                if (skuVal) {
                  const qVal = cleanNum(row['System Qty (Pcs)'] || row['System Qty'] || row['Qty'] || row['system_qty'] || 0);
                  qtyMap.set(skuVal, qVal);
                }
              });

              const updateArray = [];
              qtyMap.forEach((qty, sku) => {
                const existing = masterStock.find(m => m.sku === sku);
                updateArray.push({
                  sku,
                  name: existing ? existing.name : sku,
                  system_qty: qty
                });
              });

              const CHUNK_SIZE = 1000;
              for (let i = 0; i < updateArray.length; i += CHUNK_SIZE) {
                const chunk = updateArray.slice(i, i + CHUNK_SIZE);
                const { error } = await supabase.from('master_skus').upsert(chunk, { onConflict: 'sku' });
                if (error) throw new Error(error.message);
                const percent = Math.min(95, Math.round(15 + ((i + chunk.length) / updateArray.length) * 80));
                setUploadProgress(percent);
                setUploadStatusMsg(`Mengupdate stok ${Math.min(i + CHUNK_SIZE, updateArray.length).toLocaleString()} / ${updateArray.length.toLocaleString()} SKU...`);
              }

              await fetchCloudData();
              setUploadProgress(100);
              setTimeout(() => {
                setIsProcessingFile(false);
                alert(`Berhasil update System Qty untuk ${updateArray.length.toLocaleString()} SKU!`);
              }, 300);
              return;
            }

            const dedupMap = new Map();
            data.forEach((row) => {
              const skuVariasi = String(row['SKU Variasi'] || row['SKU'] || row['sku'] || '').trim();
              if (!skuVariasi) return;

              const existingItem = masterStock.find(m => m.sku === skuVariasi);
              const existingSysQty = existingItem ? existingItem.systemQty : 0;
              const fileSysQty = row['System Qty'] !== undefined ? cleanNum(row['System Qty']) : existingSysQty;

              dedupMap.set(skuVariasi, {
                sku: skuVariasi,
                name: String(row['Nama Product'] || row['Nama Produk'] || row['name'] || skuVariasi).trim(),
                color: String(row['Warna'] || row['color'] || '-').trim(),
                size: String(row['Ukuran'] || row['size'] || '-').trim(),
                sku_induk: String(row['SKU Induk'] || row['sku_induk'] || skuVariasi).trim(),
                sales_per_month: cleanNum(row['Sales/Bulan'] || row['sales_per_month']),
                moving_category: String(row['Kategori Moving'] || row['moving_category'] || 'Fast Moving').trim(),
                price: cleanNum(row['Harga'] || row['price']),
                price_category: String(row['Kategori Harga'] || row['price_category'] || 'Medium Value').trim(),
                zone: existingItem ? existingItem.zone : 'Lantai 1',
                system_qty: fileSysQty,
                conversion_ratio: existingItem ? existingItem.conversionRatio : 50
              });
            });

            const uniquePayload = Array.from(dedupMap.values());

            if (importMode === 'sync_delete') {
              const excelSkusSet = new Set(dedupMap.keys());
              const skusToDelete = masterStock.filter(m => !excelSkusSet.has(m.sku)).map(m => m.sku);

              if (skusToDelete.length > 0) {

                const DEL_CHUNK = 500;

                  const delSlice = skusToDelete.slice(j, j + DEL_CHUNK);

                }
              }
            }

            const CHUNK_SIZE = 1000;
            for (let i = 0; i < uniquePayload.length; i += CHUNK_SIZE) {
              const chunk = uniquePayload.slice(i, i + CHUNK_SIZE);
              const { error } = await supabase.from('master_skus').upsert(chunk, { onConflict: 'sku' });

              setUploadProgress(percent);

              setIsProcessingFile(false);
              alert(`Sukses memproses ${uniquePayload.length.toLocaleString()} SKU unik ke database!`);

          } catch (err) {
            console.error('Upload error:', err);
            setIsProcessingFile(false);

        reader.readAsBinaryString(file);

                          <p className="text-xs text-slate-400">Unduh file template berformat rapi (Header Biru, Border Tegas & Zebra Striping)</p>
                        </div>
                        <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold">
                          4 Template Tersedia
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-4">
                        <div className="bg-slate-900/80 border border-indigo-500/30 rounded-xl p-4 flex flex-col justify-between">
                          <div>
                            <span className="text-indigo-300 text-xs font-bold block mb-2">Template 1: Data Master</span>
                            <p className="text-[11px] text-slate-400 mb-3 leading-relaxed">Format minimum import data master baru.</p>
                          </div>
                          <button onClick={handleDownloadMasterTemplate} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Master</button>
                        </div>

                        <div className="bg-slate-900/80 border border-blue-500/30 rounded-xl p-4 flex flex-col justify-between">
                          <div>
                            <span className="text-blue-300 text-xs font-bold block mb-2">Template 2: Qty Stok</span>
                            <p className="text-[11px] text-slate-400 mb-3 leading-relaxed">Memuat seluruh SKU untuk update Qty System.</p>
                          </div>
                          <button onClick={handleDownloadQtyTemplate} className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Qty</button>
                        </div>

                        <div className="bg-slate-900/80 border border-emerald-500/30 rounded-xl p-4 flex flex-col justify-between">
                          <div>
                            <span className="text-emerald-300 text-xs font-bold block mb-2">Template 3: Sync & Hapus</span>
                            <p className="text-[11px] text-slate-400 mb-3 leading-relaxed">Format sync & hapus baris SKU usang.</p>
                          </div>
                          <button onClick={handleDownloadMasterSyncTemplate} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Sync</button>
                        </div>

                        <div className="bg-slate-900/80 border border-amber-500/30 rounded-xl p-4 flex flex-col justify-between">
                          <div>
                            <span className="text-amber-300 text-xs font-bold block mb-2">Template 4: SO Edit Massal</span>
                            <p className="text-[11px] text-slate-400 mb-3 leading-relaxed">Unduh data opname untuk edit massal (Gedung, SKU, Qty SO).</p>
                          </div>
                          <button onClick={handleDownloadEditSOStoreTemplate} className="w-full bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Edit SO</button>
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl relative">
                      <h2 className="text-base font-bold text-white mb-2">Import File Excel</h2>
                      <p className="text-xs text-slate-400 mb-4">Pilih opsi import sesuai template yang Anda gunakan</p>

                      <div className="grid grid-cols-2 md:grid-cols-4 gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700 mb-4">
                        <button onClick={() => setImportMode('master')} className={`py-2 px-2 text-[11px] font-semibold rounded-lg transition-all ${importMode === 'master' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>1. Import Master</button>
                        <button onClick={() => setImportMode('qty')} className={`py-2 px-2 text-[11px] font-semibold rounded-lg transition-all ${importMode === 'qty' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>2. Import Qty Stok</button>
                        <button onClick={() => setImportMode('sync_delete')} className={`py-2 px-2 text-[11px] font-semibold rounded-lg transition-all ${importMode === 'sync_delete' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>3. Sync & Hapus SKU</button>
                        <button onClick={() => setImportMode('edit_so_massal')} className={`py-2 px-2 text-[11px] font-semibold rounded-lg transition-all ${importMode === 'edit_so_massal' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>4. Import Edit SO Massal</button>
                      </div>

                      <div className="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center hover:border-blue-500 transition-colors">
                        <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" id="excel-upload-input" />
                        <label htmlFor="excel-upload-input" className="cursor-pointer flex flex-col items-center">
                          <span className="text-sm font-semibold text-blue-400">
                            Upload Excel: {importMode === 'master' ? 'Data Master Baru' : importMode === 'qty' ? 'Qty Stok Saja' : importMode === 'sync_delete' ? 'Sync & Hapus SKU Master' : 'Import Edit SO Massal'}
                          </span>
                          <span className="text-xs text-slate-500 mt-1">Format .xlsx, .xls, atau .csv didukung</span>
                        </label>
                      </div>

                      {isProcessingFile && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center space-y-3">
                            <h3 className="text-base font-bold text-white">Proses Upload Excel ke Cloud</h3>
                            <p className="text-xs text-slate-400">{uploadStatusMsg}</p>
                            <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                              <div className="bg-blue-600 h-full rounded-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
                      <h2 className="text-base font-bold text-white mb-1">Export Laporan Opname ke Excel</h2>
                      <p className="text-xs text-slate-400 mb-4">Unduh hasil audit fisik terlengkap dengan konversi otomatis Pcs ke Koli & Varian (System Qty otomatis ter-update)</p>
                      <button onClick={handleExportToExcel} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-emerald-600/35 transition-all">Download Laporan Excel Bergaya (.xls / .xlsx)</button>
                    </div>
                  </>
                ) : (
                  <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
                    <h2 className="text-base font-bold text-white">Histori File Excel yang Di-import</h2>
                    <p className="text-xs text-slate-400">Catatan riwayat file template yang pernah diunggah beserta waktu dan modus importnya</p>

                    {importHistory.length === 0 ? (
                      <div className="text-center py-8 text-xs text-slate-500 border border-dashed border-slate-700 rounded-xl">
                        Belum ada file Excel yang di-import pada sesi ini
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-900 text-slate-400 font-mono uppercase border-b border-slate-700">
                            <tr>
                              <th className="p-3">Waktu Import</th>
                              <th className="p-3">Nama File Excel</th>
                              <th className="p-3">Mode / Menu Import</th>
                              <th className="p-3">Uploader (Koordinator)</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {importHistory.map(imp => (
                              <tr key={imp.id} className="hover:bg-slate-700/30">
                                <td className="p-3 font-mono text-slate-300">{imp.timestamp}</td>
                                <td className="p-3 font-semibold text-blue-400">{imp.fileName}</td>
                                <td className="p-3"><span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">{imp.mode}</span></td>
                                <td className="p-3 text-slate-300">{imp.uploader}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'settings' && currentRole === 'koordinator' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-base font-bold text-white">Tambah Akun Tim Baru</h2>
                      <p className="text-xs text-slate-400">Buat akun Auditor atau QC tambahan (Maksimal 10 Akun).</p>
                    </div>
                    <span className="bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold">
                      {accounts.length} / 10 Akun
                    </span>
                  </div>

                  <form onSubmit={handleAddAccount} className="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                    <div>
                      <label className="block text-[11px] text-slate-300 mb-1">Nama Tampilan User</label>
                      <input 
                        type="text" 
                        placeholder="misal: Auditor 3" 
                        value={newAccName} 
                        onChange={(e) => setNewAccName(e.target.value)} 
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-300 mb-1">Peran Akses</label>
                      <select 
                        value={newAccRole} 
                        onChange={(e) => setNewAccRole(e.target.value)} 
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                      >
                        <option value="auditor">Auditor (Input Fisik)</option>
                        <option value="qc">Checker / QC (Verifikasi)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-300 mb-1">Password Akses</label>
                      <input 
                        type="password" 
                        placeholder="Password..." 
                        value={newAccPass} 
                        onChange={(e) => setNewAccPass(e.target.value)} 
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono"
                      />
                    </div>
                    <div className="md:col-span-3 flex justify-end">
                      <button 
                        type="submit" 
                        disabled={accounts.length >= 10}
                        className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md"
                      >
                        + Tambah Akun Baru
                      </button>
                    </div>
                  </form>
                </div>

                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
                  <h2 className="text-base font-bold text-white">Daftar Akun Terdaftar</h2>
                  <div className="space-y-4 pt-2">
                    {accounts.map(acc => (
                      <div key={acc.key} className="bg-slate-900 border border-slate-700/80 rounded-xl p-4 space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-blue-400 uppercase">Peran: {acc.role}</span>
                          <div className="flex items-center space-x-2">
                            <span className="text-[10px] text-slate-500 font-mono">Key: {acc.key}</span>
                            {acc.key !== 'koordinator' && (
                              <button 
                                onClick={() => handleDeleteAccount(acc.key)}
                                className="bg-rose-500/10 hover:bg-rose-500/30 text-rose-400 border border-rose-500/30 text-[10px] px-2 py-0.5 rounded transition-all"
                              >
                                Hapus
                              </button>
                            )}
                          </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">Nama Tampilan / User</label>
                            <input 
                              type="text" 
                              value={editAccountState[acc.key]?.name || ''} 
                              placeholder={acc.name}
                              onChange={(e) => {
                                const val = e.target.value;
                                setEditAccountState(prev => ({
                                  ...prev,
                                  [acc.key]: { ...prev[acc.key], name: val }
                                }));
                              }} 
                              className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                            />
                          </div>
                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">Password Baru (Opsional)</label>
                            <input 
                              type="password" 
                              placeholder="Kosongkan jika tetap" 
                              value={editAccountState[acc.key]?.pass || ''} 
                              onChange={(e) => {
                                const val = e.target.value;
                                setEditAccountState(prev => ({
                                  ...prev,
                                  [acc.key]: { ...prev[acc.key], pass: val }
                                }));
                              }} 
                              className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono"
                            />
                          </div>
                        </div>
                        <div className="flex justify-end">
                          <button 
                            onClick={() => handleSaveAccountSettings(acc.key)}
                            className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-all shadow-md"
                          >
                            Simpan Perubahan
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
