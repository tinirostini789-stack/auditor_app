                          <h2 className="text-base font-bold text-white mb-1">Export Total Laporan Opname ke Excel</h2>
                          <p className="text-xs text-slate-400 mb-3">Unduh seluruh record hasil audit fisik semua tim.</p>
                          <button onClick={() => handleExportToExcel()} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl shadow-lg transition-all">Download Laporan Total (.xlsx)</button>
                        </div>
                      </>
                    ) : (
                      <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
                        <h2 className="text-base font-bold text-white">Histori File Excel yang Di-import</h2>
                        {importHistory.length === 0 ? (
                          <div className="text-center py-8 text-xs text-slate-500 border border-dashed border-slate-700 rounded-xl">Belum ada file Excel yang di-import pada sesi ini</div>
                        ) : (
                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-900 text-slate-400 font-mono uppercase border-b border-slate-700">
                                <tr>
                                  <th className="p-3">Waktu Import</th>
                                  <th className="p-3">Nama File Excel</th>
                                  <th className="p-3">Mode / Menu Import</th>
                                  <th className="p-3">Uploader</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800">
                                {importHistory.map(imp => (
                                  <tr key={imp.id} className="hover:bg-slate-700/30">
                                    <td className="p-3 font-mono text-slate-300">{imp.timestamp}</td>
                                    <td className="p-3 font-semibold text-blue-400">{imp.fileName}</td>
                                    <td className="p-3"><span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300">{imp.mode}</span></td>
                                    <td className="p-3 text-slate-300">{imp.uploader}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    )}
                  </>
                ) : (
                  // FITUR HISTORI & DOWNLOAD KHUSUS MENU AUDITOR
                  <div className="space-y-6">
                    <div className="flex bg-slate-800/90 border border-slate-700/80 p-1.5 rounded-2xl shadow-xl">
                      <button onClick={() => setExportSubTab('my_history')} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all ${exportSubTab === 'my_history' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Histori Input SO Saya ({myAuditorLogs.length})</button>
                      <button onClick={() => setExportSubTab('quick_download')} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all ${exportSubTab === 'quick_download' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Unduh Cepat Excel</button>
                    </div>

                    {exportSubTab === 'my_history' ? (
                      <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-700/80 pb-4">
                          <div>
                            <h2 className="text-base font-bold text-white">Histori Input Opname ({currentUser})</h2>
                            <p className="text-xs text-slate-400">Daftar lengkap transaksi fisik yang Anda input sebelumnya</p>
                          </div>
                          <button onClick={() => handleExportToExcel(myAuditorLogs)} disabled={myAuditorLogs.length === 0} className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white text-xs font-semibold px-4 py-2 rounded-xl transition-all shadow-md">
                            Unduh Laporan ini (.xlsx)
                          </button>
                        </div>

                        {myAuditorLogs.length === 0 ? (
                          <div className="text-center py-10 text-xs text-slate-500 border border-dashed border-slate-700 rounded-xl">
                            Belum ada riwayat hasil input SO yang tersimpan atas nama {currentUser}.
                          </div>
                        ) : (
                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-900 text-slate-400 font-mono uppercase border-b border-slate-700">
                                <tr>
                                  <th className="p-3">Waktu & Zona</th>
                                  <th className="p-3">SKU Barang</th>
                                  <th className="p-3 text-right">Qty Auditor</th>
                                  <th className="p-3 text-center">Status Verifikasi</th>
                                  <th className="p-3 text-center">Status ACC</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800">
                                {myAuditorLogs.map(log => (
                                  <tr key={log.id} className="hover:bg-slate-700/30">
                                    <td className="p-3">
                                      <span className="font-semibold text-slate-200">{log.zone}</span>
                                      <span className="block text-[10px] text-slate-400">{log.timestamp}</span>
                                    </td>
                                    <td className="p-3">
                                      <span className="font-mono text-blue-400 font-semibold block">{log.sku}</span>
                                      <span className="text-slate-300 text-[11px]">{log.name}</span>
                                    </td>
                                    <td className="p-3 text-right font-mono text-white font-bold">
                                      {log.inputQty} {log.unit} ({log.pcsQty} Pcs)
                                    </td>
                                    <td className="p-3 text-center">
                                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${log.qcName !== '-' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-slate-800 text-slate-400 border border-slate-700'}`}>
                                        {log.qcName !== '-' ? `Verified (${log.qcName})` : 'Unverified'}
                                      </span>
                                    </td>
                                    <td className="p-3 text-center">
                                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${log.accStatus === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/30'}`}>
                                        {log.accStatus}
                                      </span>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
                        <div className="flex justify-between items-center">
                          <div>
                            <h2 className="text-base font-bold text-white">Ekspor Data Hasil Opname Saya</h2>
                            <p className="text-xs text-slate-400">Unduh data hasil pencatatan audit fisik dalam format File Excel (.xlsx)</p>
                          </div>
                          <span className="bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold">
                            {myAuditorLogs.length} Record Anda
                          </span>
                        </div>

                        <div className="pt-3">
                          <button onClick={() => handleExportToExcel(myAuditorLogs)} disabled={myAuditorLogs.length === 0} className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-semibold py-3.5 rounded-xl shadow-lg transition-all text-sm flex items-center justify-center space-x-2">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <span>Unduh Hasil Opname Saya ke Excel (.xlsx)</span>
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'settings' && currentRole === 'koordinator' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-base font-bold text-white">Tambah Akun Tim Baru</h2>
                    </div>
                    <span className="bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold">{accounts.length} / 10 Akun</span>
                  </div>

                  <form onSubmit={handleAddAccount} className="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                    <div>
                      <label className="block text-[11px] text-slate-300 mb-1">Nama Tampilan User</label>
                      <input type="text" placeholder="misal: Auditor 3" value={newAccName} onChange={(e) => setNewAccName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-300 mb-1">Peran Akses</label>
                      <select value={newAccRole} onChange={(e) => setNewAccRole(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                        <option value="auditor">Auditor (Input Fisik)</option>
                        <option value="qc">Checker / QC (Verifikasi)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-300 mb-1">Password Akses</label>
                      <input type="password" placeholder="Password..." value={newAccPass} onChange={(e) => setNewAccPass(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono" />
                    </div>
                    <div className="md:col-span-3 flex justify-end">
                      <button type="submit" disabled={accounts.length >= 10} className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md">+ Tambah Akun Baru</button>
                    </div>
                  </form>
                </div>

                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
                  <h2 className="text-base font-bold text-white">Daftar Akun Terdaftar</h2>
                  <div className="space-y-4 pt-2">
                    {accounts.map(acc => (
                      <div key={acc.key} className="bg-slate-900 border border-slate-700/80 rounded-xl p-4 space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-blue-400 uppercase">Peran: {acc.role}</span>
                          {acc.key !== 'koordinator' && (
                            <button onClick={() => handleDeleteAccount(acc.key)} className="bg-rose-500/10 hover:bg-rose-500/30 text-rose-400 border border-rose-500/30 text-[10px] px-2 py-0.5 rounded transition-all">Hapus</button>
                          )}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">Nama Tampilan</label>
                            <input type="text" value={editAccountState[acc.key]?.name || ''} placeholder={acc.name} onChange={(e) => { const val = e.target.value; setEditAccountState(prev => ({ ...prev, [acc.key]: { ...prev[acc.key], name: val } })); }} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                          </div>
                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">Password Baru</label>
                            <input type="password" placeholder="Kosongkan jika tetap" value={editAccountState[acc.key]?.pass || ''} onChange={(e) => { const val = e.target.value; setEditAccountState(prev => ({ ...prev, [acc.key]: { ...prev[acc.key], pass: val } })); }} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono" />
                          </div>
                        </div>
                        <div className="flex justify-end">
                          <button onClick={() => handleSaveAccountSettings(acc.key)} className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-all shadow-md">Simpan Perubahan</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
