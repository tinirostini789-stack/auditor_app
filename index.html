<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuditStock Pro Workspace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- XLSX Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = 'https://kfnlmryobtyovvnrscfv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EaBvbXs2xCsVC0n7xlbK2g__WjqLbG0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const INITIAL_MASTER_STOCK = [
      { id: '1', name: 'Sepatu Running Speed', color: 'Merah', size: '42', skuInduk: 'SKU-RUN-SPD', sku: 'SKU-RUN-SPD-RED-42', salesPerMonth: 120, movingCategory: 'Fast Moving', price: 550000, priceCategory: 'Medium Value', zone: 'Zona A1', systemQty: 120, conversionRatio: 50 },
      { id: '2', name: 'Tas BackPack Travel', color: 'Hitam', size: '30L', skuInduk: 'SKU-BAG-TRV', sku: 'SKU-BAG-TRV-BLK-30L', salesPerMonth: 15, movingCategory: 'Slow Moving', price: 1850000, priceCategory: 'High Value', zone: 'Zona A2', systemQty: 250, conversionRatio: 50 },
      { id: '3', name: 'Lemari Jati Jepara', color: 'Cokelat', size: '1x2m', skuInduk: 'Lemari Jati', sku: 'lemari-jati-coklat-2m', salesPerMonth: 275, movingCategory: 'Fast Moving', price: 2000000, priceCategory: 'High Value', zone: 'Zona B1', systemQty: 500, conversionRatio: 10 }
    ];

    const DEFAULT_ACCOUNTS = [
      { key: 'koordinator', name: 'Koordinator (Bahrudin)', role: 'koordinator', pass: 'admin123' },
      { key: 'auditor1', name: 'Auditor 1', role: 'auditor', pass: 'auditor123' },
      { key: 'auditor2', name: 'Auditor 2', role: 'auditor', pass: 'auditor123' },
      { key: 'qc', name: 'Checker / QC', role: 'qc', pass: 'qc123' }
    ];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState('');
      const [currentRole, setCurrentRole] = useState(''); 
      const [loginInputKey, setLoginInputKey] = useState('koordinator');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [accounts, setAccounts] = useState(DEFAULT_ACCOUNTS);
      const [editAccountState, setEditAccountState] = useState({});

      const [newAccName, setNewAccName] = useState('');
      const [newAccRole, setNewAccRole] = useState('auditor');
      const [newAccPass, setNewAccPass] = useState('');

      const [activeTab, setActiveTab] = useState('opname');
      const [masterStock, setMasterStock] = useState(INITIAL_MASTER_STOCK);
      const [auditLogs, setAuditLogs] = useState([]);
      const [actionHistory, setActionHistory] = useState([]); 
      const [importHistory, setImportHistory] = useState([]); 
      const [exportSubTab, setExportSubTab] = useState('upload'); 

      const [todos, setTodos] = useState([]);
      const [todoPeriod, setTodoPeriod] = useState('Harian');
      const [todoPrioritySort, setTodoPrioritySort] = useState('DESC');
      
      const [taskTitle, setTaskTitle] = useState('');
      const [taskDesc, setTaskDesc] = useState('');
      const [taskPriority, setTaskPriority] = useState('High');
      const [taskDueDate, setTaskDueDate] = useState('');
      const [taskCategory, setTaskCategory] = useState('Harian');
      const [taskAssignedTo, setTaskAssignedTo] = useState('Semua Tim');

      const [importMode, setImportMode] = useState('master');
      const [dbStatus, setDbStatus] = useState('Menghubungkan ke Cloud...');

      const [isProcessingFile, setIsProcessingFile] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);
      const [uploadStatusMsg, setUploadStatusMsg] = useState('');

      const [selectedZone, setSelectedZone] = useState('Zona A1');
      const [customZone, setCustomZone] = useState('');
      const [skuInput, setSkuInput] = useState('');
      const [selectedSkuObj, setSelectedSkuObj] = useState(null);
      const [inputQty, setInputQty] = useState('');
      const [checkerQty, setCheckerQty] = useState(''); // <-- Qty Tambahan Checker/QC
      const [unit, setUnit] = useState('Pcs');
      const [conversionRatio, setConversionRatio] = useState(50);
      const [auditorNote, setAuditorNote] = useState('');
      const [showSuggestions, setShowSuggestions] = useState(false);

      const [dashboardSearch, setDashboardSearch] = useState('');
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

      const defaultZones = ['Zona A1', 'Zona A2', 'Zona B1', 'Zona B2', 'Zona C1', 'Zona C3', 'Bulk Area', 'Lainnya...'];

      useEffect(() => {
        fetchCloudData();
      }, []);

      const logActionHistory = (type, sku, details) => {
        const timestamp = new Date().toLocaleString('id-ID');
        const newHistoryItem = {
          id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
          timestamp,
          actor: currentUser,
          role: currentRole,
          type,
          sku,
          details
        };
        setActionHistory(prev => [newHistoryItem, ...prev]);
      };

      const fetchCloudData = async () => {
        try {
          setDbStatus('Memuat data cloud...');
          
          const { data: accData, error: accError } = await supabase.from('app_accounts').select('*');
          if (!accError && accData && accData.length > 0) {
            const formattedAccs = accData.map(a => ({
              key: a.account_key,
              name: a.account_name,
              role: a.role,
              pass: a.password
            }));
            setAccounts(formattedAccs);
            const initialEdits = {};
            formattedAccs.forEach(a => { initialEdits[a.key] = { name: a.name, pass: '' }; });
            setEditAccountState(initialEdits);
          } else {
            for (const acc of DEFAULT_ACCOUNTS) {
              await supabase.from('app_accounts').upsert({
                account_key: acc.key, account_name: acc.name, role: acc.role, password: acc.pass
              }, { onConflict: 'account_key' });
            }
          }

          const { data: todoData, error: todoError } = await supabase.from('audit_todos').select('*');
          if (!todoError && todoData && todoData.length > 0) {
            const formattedTodos = todoData.map(t => ({
              id: t.id,
              title: t.title,
              description: t.description,
              priority: t.priority,
              period: t.period,
              dueDate: t.due_date,
              assignedTo: t.assigned_to,
              completed: t.completed
            }));
            setTodos(formattedTodos);
          }

          const { data: skuData, error: skuError } = await supabase.from('master_skus').select('*');
          if (!skuError && skuData && skuData.length > 0) {
            const formattedMaster = skuData.map(item => ({
              id: item.sku,
              name: item.name,
              color: item.color,
              size: item.size,
              skuInduk: item.sku_induk,
              sku: item.sku,
              salesPerMonth: item.sales_avg,
              movingCategory: item.moving_category,
              price: item.price,
              priceCategory: item.price_category,
              zone: 'Zona A1',
              systemQty: item.system_qty,
              conversionRatio: item.conversion_ratio
            }));
            setMasterStock(formattedMaster);
          }

          const { data: logData, error: logError } = await supabase.from('audit_logs').select('*').order('timestamp', { ascending: false });
          if (!logError && logData && logData.length > 0) {
            const formattedLogs = logData.map(log => ({
              id: log.id,
              timestamp: log.timestamp,
              zone: log.zone,
              sku: log.sku,
              name: log.name,
              inputQty: log.input_qty,
              checkerQty: log.checker_qty !== undefined && log.checker_qty !== null ? log.checker_qty : 0,
              unit: log.unit,
              pcsQty: log.pcs_qty,
              koliQty: log.karung_qty,
              conversionRatio: log.conversion_ratio || 50,
              systemQty: 0,
              note: log.auditor_note,
              auditorName: log.auditor_name || 'System / Umum',
              qcName: log.qc_name || '-',
              accStatus: log.acc_status || 'PENDING',
              accBy: log.acc_by || '-'
            }));
            setAuditLogs(formattedLogs);
          }

          setDbStatus('🟢 Terhubung ke Cloud Supabase');
        } catch (err) {
          console.error('Gagal memuat data cloud:', err.message);
          setDbStatus('🔴 Mode Offline / Gagal Sinkron');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');

        const targetAcc = accounts.find(a => a.key === loginInputKey);
        if (!targetAcc || targetAcc.pass !== loginPassword) {
          setLoginError('Password atau akun salah!');
          return;
        }

        setCurrentUser(targetAcc.name);
        setCurrentRole(targetAcc.role);
        setIsLoggedIn(true);
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setCurrentUser('');
        setCurrentRole('');
        setLoginPassword('');
      };

      const handleAddAccount = async (e) => {
        e.preventDefault();
        if (accounts.length >= 10) {
          alert('Batas Maksimal 10 Akun Tercapai!');
          return;
        }
        if (!newAccName || !newAccPass) {
          alert('Nama user dan password wajib diisi!');
          return;
        }

        const newKey = `user_${Date.now()}`;
        const newAcc = {
          key: newKey,
          name: newAccName,
          role: newAccRole,
          pass: newAccPass
        };

        const updated = [...accounts, newAcc];
        setAccounts(updated);
        setEditAccountState(prev => ({ ...prev, [newKey]: { name: newAccName, pass: '' } }));

        try {
          await supabase.from('app_accounts').insert([{
            account_key: newKey,
            account_name: newAccName,
            role: newAccRole,
            password: newAccPass
          }]);
          setNewAccName('');
          setNewAccPass('');
          alert('Akun baru berhasil ditambahkan dan tersimpan ke Cloud Supabase!');
        } catch (err) {
          console.error('Gagal tambah akun:', err);
        }
      };

      const handleDeleteAccount = async (key) => {
        if (key === 'koordinator') {
          alert('Akun Utama Koordinator tidak bisa dihapus!');
          return;
        }
        if (!confirm('Apakah Anda yakin ingin menghapus akun ini?')) return;

        const updated = accounts.filter(a => a.key !== key);
        setAccounts(updated);

        try {
          await supabase.from('app_accounts').delete().eq('account_key', key);
          alert('Akun berhasil dihapus dari cloud!');
        } catch (err) {
          console.error('Gagal hapus akun:', err);
        }
      };

      const handleSaveAccountSettings = async (key) => {
        const currentEdit = editAccountState[key] || {};
        const targetAcc = accounts.find(a => a.key === key);
        
        const newName = currentEdit.name ? currentEdit.name : targetAcc.name;
        const newPass = currentEdit.pass ? currentEdit.pass : targetAcc.pass;

        const updated = accounts.map(acc => {
          if (acc.key === key) {
            return { ...acc, name: newName, pass: newPass };
          }
          return acc;
        });

        setAccounts(updated);

        try {
          await supabase.from('app_accounts').upsert({
            account_key: key,
            account_name: newName,
            role: targetAcc.role,
            password: newPass
          }, { onConflict: 'account_key' });
          alert('Perubahan akun berhasil disimpan ke Cloud Supabase!');
        } catch (err) {
          console.error('Gagal update akun ke cloud:', err);
        }
      };

      const handleSelectSku = (item) => {
        setSkuInput(item.sku);
        setSelectedSkuObj(item);
        setConversionRatio(item.conversionRatio || 50);
        setShowSuggestions(false);
      };

      const skuSuggestions = useMemo(() => {
        if (!skuInput.trim()) return [];
        const query = skuInput.toLowerCase();
        return masterStock.filter(item => item.sku.toLowerCase().includes(query) || item.name.toLowerCase().includes(query));
      }, [skuInput, masterStock]);

      const convertedValues = useMemo(() => {
        const qty = parseFloat(inputQty) || 0;
        const ratio = parseFloat(conversionRatio) || 1;
        if (unit === 'Koli') {
          return { pcs: qty * ratio, koli: qty, displayText: `${qty} Koli = ${(qty * ratio).toLocaleString()} Pcs (${ratio} Pcs/Koli)` };
        } else {
          return { pcs: qty, koli: qty / ratio, displayText: `${qty} Pcs = ${(qty / ratio).toFixed(2)} Koli (${ratio} Pcs/Koli)` };
        }
      }, [inputQty, unit, conversionRatio]);

      const handleAddAuditLog = async (e) => {
        e.preventDefault();
        if (currentRole === 'qc') {
          alert('Akun QC tidak diizinkan untuk menginput data audit fisik awal.');
          return;
        }
        if (!skuInput || !inputQty || parseFloat(inputQty) <= 0) {
          alert('Mohon isi SKU dan Jumlah Qty yang valid!');
          return;
        }
        const zoneToSave = selectedZone === 'Lainnya...' ? customZone : selectedZone;
        const activeSkuObj = selectedSkuObj || { sku: skuInput, name: 'SKU Non-Master / Item Baru', systemQty: 0 };

        const newLogId = Date.now().toString();
        const currentTimestamp = new Date().toLocaleString('id-ID');
        const parsedCheckerQty = parseFloat(checkerQty) || 0;

        const newLog = {
          id: newLogId,
          timestamp: currentTimestamp,
          zone: zoneToSave || 'Zona General',
          sku: activeSkuObj.sku,
          name: activeSkuObj.name,
          inputQty: parseFloat(inputQty),
          checkerQty: parsedCheckerQty,
          unit: unit,
          pcsQty: convertedValues.pcs,
          koliQty: convertedValues.koli,
          conversionRatio: parseFloat(conversionRatio),
          systemQty: activeSkuObj.systemQty || 0,
          note: auditorNote,
          auditorName: currentUser,
          qcName: '-',
          accStatus: 'PENDING',
          accBy: '-'
        };

        setAuditLogs([newLog, ...auditLogs]);
        logActionHistory('TAMBAH_SKU', activeSkuObj.sku, `Input ${inputQty} ${unit} (Checker Qty: ${parsedCheckerQty}) di ${zoneToSave || 'Zona General'}`);

        setSkuInput('');
        setSelectedSkuObj(null);
        setInputQty('');
        setCheckerQty('');
        setAuditorNote('');

        try {
          await supabase.from('audit_logs').insert([{
            id: newLogId,
            timestamp: currentTimestamp,
            zone: zoneToSave || 'Zona General',
            sku: activeSkuObj.sku,
            name: activeSkuObj.name,
            input_qty: parseFloat(inputQty),
            checker_qty: parsedCheckerQty,
            unit: unit,
            pcs_qty: convertedValues.pcs,
            karung_qty: convertedValues.koli,
            conversion_ratio: parseFloat(conversionRatio),
            auditor_note: auditorNote,
            auditor_name: currentUser,
            qc_name: '-',
            acc_status: 'PENDING',
            acc_by: '-'
          }]);
        } catch (err) {
          console.error('Error cloud database:', err);
        }
      };

      const handleDeleteAuditLog = async (id, logAuthor, logSku) => {
        if (currentRole === 'qc') {
          alert('Akses Ditolak! Akun QC tidak diizinkan untuk menghapus data record opname.');
          return;
        }

        if (currentRole === 'auditor' && currentUser !== logAuthor) {
          alert('Anda hanya dapat menghapus data yang Anda input sendiri!');
          return;
        }

        if (!confirm(`Apakah Anda yakin ingin menghapus record SKU: ${logSku}?`)) return;

        setAuditLogs(auditLogs.filter(log => log.id !== id));
        logActionHistory('HAPUS_SKU', logSku, `Menghapus record fisik yang dibuat oleh ${logAuthor}`);

        try {
          await supabase.from('audit_logs').delete().eq('id', id);
        } catch (err) {
          console.error('Gagal menghapus dari cloud:', err);
        }
      };

      const handleAccLog = async (id, currentStatus, skuCode) => {
        if (currentRole !== 'koordinator') {
          alert('Akses Ditolak! Hanya Koordinator yang berhak memberikan ACC persetujuan.');
          return;
        }
        const newStatus = currentStatus === 'APPROVED' ? 'PENDING' : 'APPROVED';
        const approver = currentUser;
        
        setAuditLogs(auditLogs.map(log => log.id === id ? { ...log, accStatus: newStatus, accBy: approver } : log));
        logActionHistory(
          newStatus === 'APPROVED' ? 'ACC_KOORDINATOR_APPROVED' : 'ACC_KOORDINATOR_CANCEL', 
          skuCode, 
          newStatus === 'APPROVED' ? `ACC disetujui oleh ${approver}` : `Persetujuan ACC dibatalkan oleh ${approver}`
        );

        try {
          await supabase.from('audit_logs').update({ 
            acc_status: newStatus, 
            acc_by: approver 
          }).eq('id', id);
        } catch (err) {
          console.error('Gagal memperbarui status ACC:', err);
        }
      };

      const handleQcUpdate = async (id, currentQc, skuCode) => {
        const qcPerson = currentUser;
        const newQc = currentQc === '-' ? qcPerson : '-';

        setAuditLogs(auditLogs.map(log => log.id === id ? { ...log, qcName: newQc } : log));
        logActionHistory(
          newQc !== '-' ? 'ACC_QC_CHECKED' : 'ACC_QC_UNCHECKED', 
          skuCode, 
          newQc !== '-' ? `Di-verifikasi (Checked) oleh QC ${qcPerson}` : `Verifikasi QC dibatalkan`
        );

        try {
          await supabase.from('audit_logs').update({ qc_name: newQc }).eq('id', id);
        } catch (err) {
          console.error('Gagal memperbarui status QC:', err);
        }
      };

      // Handler Update Qty Checker Langsung di Tabel History/Record
      const handleUpdateCheckerQtyInline = async (id, newCheckerVal, skuCode) => {
        const parsedVal = parseFloat(newCheckerVal) || 0;
        setAuditLogs(auditLogs.map(log => log.id === id ? { ...log, checkerQty: parsedVal } : log));
        
        try {
          await supabase.from('audit_logs').update({ checker_qty: parsedVal }).eq('id', id);
        } catch (err) {
          console.error('Gagal update checker qty ke cloud:', err);
        }
      };

      const handleCreateTask = async (e) => {
        e.preventDefault();
        if (currentRole !== 'koordinator') {
          alert('Hanya Koordinator yang berhak memberikan task To-Do!');
          return;
        }
        if (!taskTitle) {
          alert('Nama task wajib diisi!');
          return;
        }

        const newId = `t_${Date.now()}`;
        const newTask = {
          id: newId,
          title: taskTitle,
          description: taskDesc || '-',
          priority: taskPriority,
          period: taskCategory,
          dueDate: taskDueDate || new Date().toISOString().split('T')[0],
          assignedTo: taskAssignedTo,
          completed: false
        };

        setTodos([newTask, ...todos]);
        setTodoPeriod(taskCategory); 
        setTaskTitle('');
        setTaskDesc('');
        setTaskDueDate('');
        alert(`Task "${taskTitle}" berhasil diberikan dan tersimpan ke Cloud!`);

        try {
          await supabase.from('audit_todos').insert([{
            id: newId,
            title: newTask.title,
            description: newTask.description,
            priority: newTask.priority,
            period: newTask.period,
            due_date: newTask.dueDate,
            assigned_to: newTask.assignedTo,
            completed: newTask.completed
          }]);
        } catch (err) {
          console.error('Gagal menyimpan task ke database cloud:', err);
        }
      };

      const handleToggleTask = async (taskId, currentCompleted) => {
        const nextStatus = !currentCompleted;
        setTodos(todos.map(t => t.id === taskId ? { ...t, completed: nextStatus } : t));

        try {
          await supabase.from('audit_todos').update({ completed: nextStatus }).eq('id', taskId);
        } catch (err) {
          console.error('Gagal memperbarui status task di cloud:', err);
        }
      };

      const handleDeleteTask = async (taskId) => {
        if (currentRole !== 'koordinator') {
          alert('Hanya Koordinator yang berhak menghapus task To-Do!');
          return;
        }
        if (confirm('Hapus task ini?')) {
          setTodos(todos.filter(t => t.id !== taskId));
          try {
            await supabase.from('audit_todos').delete().eq('id', taskId);
          } catch (err) {
            console.error('Gagal menghapus task dari cloud:', err);
          }
        }
      };

      const sortedFilteredTodos = useMemo(() => {
        let filtered = todos.filter(t => t.period === todoPeriod);
        const priorityWeight = { 'High': 3, 'Medium': 2, 'Low': 1 };
        
        return filtered.sort((a, b) => {
          const wA = priorityWeight[a.priority] || 0;
          const wB = priorityWeight[b.priority] || 0;
          return todoPrioritySort === 'DESC' ? wB - wA : wA - wB;
        });
      }, [todos, todoPeriod, todoPrioritySort]);

      const reconciliationData = useMemo(() => {
        const physicalCounts = {};
        auditLogs.forEach(log => {
          physicalCounts[log.sku] = (physicalCounts[log.sku] || 0) + log.pcsQty;
        });

        let items = masterStock.map(stock => {
          const physicalQty = physicalCounts[stock.sku] || 0;
          const discrepancyPcs = physicalQty - stock.systemQty;
          const ratio = stock.conversionRatio || 50;
          const discrepancyKoli = discrepancyPcs / ratio;
          let status = 'MATCHED';
          if (discrepancyPcs > 0) status = 'OVERSTOCK';
          if (discrepancyPcs < 0) status = 'SHORTAGE';
          return { ...stock, physicalQty, discrepancyPcs, discrepancyKoli, status };
        });

        if (dashboardSearch.trim()) {
          const q = dashboardSearch.toLowerCase();
          items = items.filter(item => item.sku.toLowerCase().includes(q) || item.name.toLowerCase().includes(q));
        }

        if (sortConfig.key) {
          items.sort((a, b) => {
            let aVal = a[sortConfig.key];
            let bVal = b[sortConfig.key];

            if (sortConfig.key === 'systemQty') {
              aVal = a.systemQty || 0;
              bVal = b.systemQty || 0;
            } else if (sortConfig.key === 'physicalQty') {
              aVal = a.physicalQty || 0;
              bVal = b.physicalQty || 0;
            } else if (sortConfig.key === 'discrepancyPcs') {
              aVal = a.discrepancyPcs || 0;
              bVal = b.discrepancyPcs || 0;
            } else if (sortConfig.key === 'status') {
              aVal = a.status || '';
              bVal = b.status || '';
            }

            if (typeof aVal === 'string') {
              return sortConfig.direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
            } else {
              return sortConfig.direction === 'asc' ? aVal - bVal : bVal - aVal;
            }
          });
        }

        const totalAuditedPcs = Object.values(physicalCounts).reduce((a, b) => a + b, 0);
        const totalSystemPcs = masterStock.reduce((a, b) => a + (b.systemQty || 0), 0);
        const netDiscrepancy = totalAuditedPcs - totalSystemPcs;
        
        const allItemsForCount = masterStock.map(stock => {
          const pQty = physicalCounts[stock.sku] || 0;
          return pQty - stock.systemQty;
        });
        const totalDiscrepanciesCount = allItemsForCount.filter(diff => diff !== 0).length;
        const totalSkusCount = masterStock.length;

        return { items, totalAuditedPcs, totalSystemPcs, netDiscrepancy, totalDiscrepanciesCount, totalSkusCount };
      }, [masterStock, auditLogs, dashboardSearch, sortConfig]);

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setSortConfig({ key, direction });
      };

      const downloadNativeExcel = (sheetName, headers, rows, filename) => {
        try {
          if (!window.XLSX) {
            alert('Pustaka Excel sedang dimuat...');
            return;
          }
          const aoaData = [headers, ...rows];
          const worksheet = window.XLSX.utils.aoa_to_sheet(aoaData);
          const workbook = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
          window.XLSX.writeFile(workbook, filename);
        } catch (err) {
          alert('Gagal mengunduh file Excel: ' + err.message);
        }
      };

      const handleDownloadMasterTemplate = () => {
        const headers = ['No', 'Nama Produk', 'Variasi Warna', 'Variasi Ukuran', 'SKU Induk', 'SKU Variasi', 'Sales Rata2 / Bulan', 'Kategori Moving Barang', 'Harga Barang', 'Kategori Harga Barang'];
        const rows = [
          [1, 'Sepatu Running Speed', 'Merah', '42', 'SKU-RUN-SPD', 'SKU-RUN-SPD-RED-42', 120, 'Fast Moving', 550000, 'Medium Value'],
          [2, 'Tas BackPack Travel', 'Hitam', '30L', 'SKU-BAG-TRV', 'SKU-BAG-TRV-BLK-30L', 15, 'Slow Moving', 1850000, 'High Value'],
          [3, 'Lemari Jati Jepara', 'Cokelat', '1x2m', 'Lemari Jati', 'lemari-jati-coklat-2m', 275, 'Fast Moving', 2000000, 'High Value']
        ];
        downloadNativeExcel('Master Data', headers, rows, 'Template_Master_Data.xlsx');
      };

      const handleDownloadQtyTemplate = () => {
        const headers = ['No', 'SKU Variasi', 'Qty System', 'Isi Per Koli'];
        const rows = masterStock.map((item, index) => [index + 1, item.sku, item.systemQty || 0, item.conversionRatio || 50]);
        downloadNativeExcel('Qty System', headers, rows, 'Template_Qty_Stok.xlsx');
      };

      const handleDownloadMasterSyncTemplate = () => {
        const headers = ['No', 'Nama Produk', 'Variasi Warna', 'Variasi Ukuran', 'SKU Induk', 'SKU Variasi', 'Sales Rata2 / Bulan', 'Kategori Moving Barang', 'Harga Barang', 'Kategori Harga Barang', 'Qty System', 'Isi Per Koli'];
        const rows = masterStock.map((item, index) => [
          index + 1, item.name, item.color, item.size, item.skuInduk, item.sku, 
          item.salesPerMonth, item.movingCategory, item.price, item.priceCategory, 
          item.systemQty || 0, item.conversionRatio || 50
        ]);
        downloadNativeExcel('Master Sync & Delete', headers, rows, 'Template_Master_Sync_Dan_Hapus.xlsx');
      };

      const handleExportToExcel = () => {
        if (currentRole !== 'koordinator') {
          alert('Hanya Koordinator yang dapat mengekspor laporan akhir!');
          return;
        }
        if (auditLogs.length === 0) {
          alert('Belum ada data opname fisik untuk diexport!');
          return;
        }
        const headers = ['No', 'Waktu Audit', 'Zona / Lokasi', 'Kode SKU Variasi', 'Nama Produk', 'Qty Auditor', 'Qty Checker', 'Satuan Input', 'Rasio Konversi', 'Physical Qty (Pcs)', 'System Qty (Pcs)', 'Selisih (Pcs)', 'Author (Auditor)', 'QC Check', 'Status ACC Koordinator', 'Catatan Auditor'];
        const rows = auditLogs.map((log, index) => {
          const systemQty = log.systemQty || 0;
          const selisihPcs = log.pcsQty - systemQty;
          return [
            index + 1, log.timestamp, log.zone, log.sku, log.name, log.inputQty, log.checkerQty || 0, log.unit, log.conversionRatio, 
            log.pcsQty, systemQty, selisihPcs, 
            log.auditorName, log.qcName, log.accStatus, log.note || '-'
          ];
        });
        downloadNativeExcel('Hasil Opname', headers, rows, `Laporan_Stock_Opname_${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      const cleanKey = (key) => key ? String(key).trim().toLowerCase().replace(/[^a-z0-9]/g, '') : '';
      const parseNumber = (val) => {
        if (typeof val === 'number') return val;
        if (!val) return 0;
        return parseFloat(String(val).replace(/\./g, '').replace(/,/g, '.').replace(/[^0-9.-]/g, '')) || 0;
      };

      const handleFileUpload = (e) => {
        if (currentRole !== 'koordinator') {
          alert('Akses Ditolak! Hanya Koordinator yang berhak melakukan import data.');
          return;
        }
        const file = e.target.files[0];
        if (!file) return;
        setIsProcessingFile(true);
        setUploadProgress(50);
        setUploadStatusMsg('Membaca file Excel...');
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array', cellDates: true });
            const firstSheetName = workbook.SheetNames[0];
            const json = window.XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName], { defval: '', raw: false });
            
            let updatedMaster = [...masterStock];
            const modeNameLabel = importMode === 'master' ? '1. Import Data Master Baru' : importMode === 'qty' ? '2. Import Qty Stok Saja' : '3. Sync & Hapus SKU Master';

            if (importMode === 'master') {
              for (const row of json) {
                const findValue = (names) => {
                  const cleanedNames = names.map(cleanKey);
                  for (const k of Object.keys(row)) {
                    if (cleanedNames.includes(cleanKey(k))) return row[k];
                  }
                  return '';
                };
                const sku = String(findValue(['SKU Variasi', 'SKU'])).trim();
                if (!sku) continue;
                const name = String(findValue(['Nama Produk', 'NamaBarang']) || 'Barang Baru').trim();
                const color = String(findValue(['Variasi Warna', 'Warna']) || '-').trim();
                const size = String(findValue(['Variasi Ukuran', 'Ukuran']) || '-').trim();
                const skuInduk = String(findValue(['SKU Induk']) || '-').trim();
                const sales = parseNumber(findValue(['Sales Rata2 / Bulan', 'Sales']));
                const movingCategory = String(findValue(['Kategori Moving Barang', 'Kategori Moving']) || 'Medium Moving').trim();
                const price = parseNumber(findValue(['Harga Barang', 'Harga']));
                const priceCategory = String(findValue(['Kategori Harga Barang']) || 'Medium Value').trim();

                const existingIndex = updatedMaster.findIndex(item => item.sku.toLowerCase() === sku.toLowerCase());
                const newItem = { id: existingIndex >= 0 ? updatedMaster[existingIndex].id : sku, name, color, size, skuInduk, sku, salesPerMonth: sales, movingCategory, price, priceCategory, zone: 'Zona A1', systemQty: existingIndex >= 0 ? updatedMaster[existingIndex].systemQty : 0, conversionRatio: 50 };
                
                if (existingIndex >= 0) updatedMaster[existingIndex] = { ...updatedMaster[existingIndex], ...newItem };
                else updatedMaster.push(newItem);

                await supabase.from('master_skus').upsert({
                  sku: sku, name: name, color: color, size: size, sku_induk: skuInduk, sku_variasi: sku,
                  sales_avg: sales, moving_category: movingCategory, price: price, price_category: priceCategory,
                  system_qty: existingIndex >= 0 ? updatedMaster[existingIndex].systemQty : 0, conversion_ratio: 50
                });
              }
            } else if (importMode === 'qty') {
              for (const row of json) {
                const findValue = (names) => {
                  const cleanedNames = names.map(cleanKey);
                  for (const k of Object.keys(row)) {
                    if (cleanedNames.includes(cleanKey(k))) return row[k];
                  }
                  return '';
                };
                const sku = String(findValue(['SKU Variasi', 'SKU'])).trim();
                if (!sku) continue;
                const newQty = parseNumber(findValue(['Qty System', 'Qty']));
                const ratio = parseNumber(findValue(['Isi Per Koli', 'Isi Per Karung', 'Rasio'])) || 50;
                const existingIndex = updatedMaster.findIndex(item => item.sku.toLowerCase() === sku.toLowerCase());
                
                if (existingIndex >= 0) {
                  updatedMaster[existingIndex].systemQty = newQty;
                  updatedMaster[existingIndex].conversionRatio = ratio;
                } else {
                  updatedMaster.push({ id: sku, name: 'Item (' + sku + ')', color: '-', size: '-', skuInduk: '-', sku, salesPerMonth: 0, movingCategory: 'Medium Moving', price: 0, priceCategory: 'Medium Value', zone: 'Zona A1', systemQty: newQty, conversionRatio: ratio });
                }

                await supabase.from('master_skus').update({ system_qty: newQty, conversion_ratio: ratio }).eq('sku', sku);
              }
            } else if (importMode === 'sync_delete') {
              const excelSkus = [];
              const newMasterList = [];

              for (const row of json) {
                const findValue = (names) => {
                  const cleanedNames = names.map(cleanKey);
                  for (const k of Object.keys(row)) {
                    if (cleanedNames.includes(cleanKey(k))) return row[k];
                  }
                  return '';
                };
                const sku = String(findValue(['SKU Variasi', 'SKU'])).trim();
                if (!sku) continue;
                excelSkus.push(sku.toLowerCase());

                const name = String(findValue(['Nama Produk', 'NamaBarang']) || 'Barang Baru').trim();
                const color = String(findValue(['Variasi Warna', 'Warna']) || '-').trim();
                const size = String(findValue(['Variasi Ukuran', 'Ukuran']) || '-').trim();
                const skuInduk = String(findValue(['SKU Induk']) || '-').trim();
                const sales = parseNumber(findValue(['Sales Rata2 / Bulan', 'Sales']));
                const movingCategory = String(findValue(['Kategori Moving Barang', 'Kategori Moving']) || 'Medium Moving').trim();
                const price = parseNumber(findValue(['Harga Barang', 'Harga']));
                const priceCategory = String(findValue(['Kategori Harga Barang']) || 'Medium Value').trim();
                const systemQty = parseNumber(findValue(['Qty System', 'Qty'])) || 0;
                const conversionRatio = parseNumber(findValue(['Isi Per Koli', 'Isi Per Karung', 'Rasio'])) || 50;

                const newItem = { id: sku, name, color, size, skuInduk, sku, salesPerMonth: sales, movingCategory, price, priceCategory, zone: 'Zona A1', systemQty, conversionRatio };
                newMasterList.push(newItem);

                await supabase.from('master_skus').upsert({
                  sku: sku, name: name, color: color, size: size, sku_induk: skuInduk, sku_variasi: sku,
                  sales_avg: sales, moving_category: movingCategory, price: price, price_category: priceCategory,
                  system_qty: systemQty, conversion_ratio: conversionRatio
                }, { onConflict: 'sku' });
              }

              const skusToDelete = masterStock.filter(item => !excelSkus.includes(item.sku.toLowerCase()));
              for (const delItem of skusToDelete) {
                await supabase.from('master_skus').delete().eq('sku', delItem.sku);
              }

              updatedMaster = newMasterList;
            }

            setMasterStock(updatedMaster);

            const newImportLog = {
              id: Date.now().toString(),
              timestamp: new Date().toLocaleString('id-ID'),
              fileName: file.name,
              mode: modeNameLabel,
              uploader: currentUser
            };
            setImportHistory(prev => [newImportLog, ...prev]);

            setUploadProgress(100);
            setUploadStatusMsg('Sinkronisasi & Hapus SKU Selesai di Cloud!');
            setTimeout(() => setIsProcessingFile(false), 1200);
          } catch (err) {
            setIsProcessingFile(false);
            alert('Gagal memproses file.');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center">
                <div className="inline-block p-3 bg-blue-600/20 text-blue-400 rounded-2xl mb-3">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <h1 className="text-xl font-bold text-white">AuditStock Pro Security</h1>
                <p className="text-xs text-slate-400 mt-1">Silakan login terlebih dahulu untuk mengakses sistem</p>
              </div>

              {loginError && (
                <div className="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-xl text-center">
                  {loginError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Pilih Akun / Peran ({accounts.length} Akun Tersedia)</label>
                  <select 
                    value={loginInputKey} 
                    onChange={(e) => setLoginInputKey(e.target.value)} 
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500"
                  >
                    {accounts.map(acc => (
                      <option key={acc.key} value={acc.key}>{acc.name} ({acc.role.toUpperCase()})</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Password Akses</label>
                  <input 
                    type="password" 
                    placeholder="Masukkan password..." 
                    value={loginPassword} 
                    onChange={(e) => setLoginPassword(e.target.value)} 
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 font-mono"
                    autoFocus
                  />
                </div>

                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg transition-all text-sm">
                  Masuk ke Sistem
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans antialiased flex flex-col">
          <header className="sticky top-0 z-40 bg-slate-950 border-b border-slate-800 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div className="flex items-center space-x-3">
                  <div className="p-2 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl shadow-lg">
                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <h1 className="text-lg font-bold text-white">AuditStock Pro</h1>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-mono px-2 py-0.5 rounded-full border border-emerald-500/30">{dbStatus}</span>
                    </div>
                    <p className="text-xs text-slate-400">Login: <strong className="text-blue-400">{currentUser}</strong> ({currentRole.toUpperCase()})</p>
                  </div>
                </div>

                <div className="flex items-center space-x-3">
                  <nav className="flex space-x-1 sm:space-x-2">
                    <button onClick={() => setActiveTab('opname')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'opname' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800'}`}>Opname</button>
                    <button onClick={() => setActiveTab('todos')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'todos' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800'}`}>To-Do</button>
                    <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800'}`}>Dashboard</button>
                    
                    {currentRole === 'koordinator' && (
                      <button onClick={() => setActiveTab('export')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'export' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800'}`}>Import & Laporan</button>
                    )}

                    {currentRole === 'koordinator' && (
                      <button onClick={() => setActiveTab('settings')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'settings' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800'}`}>Pengaturan Akun</button>
                    )}
                  </nav>
                  
                  <button onClick={handleLogout} className="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 text-xs px-3 py-2 rounded-lg font-semibold transition-all">
                    Keluar
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {activeTab === 'opname' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-5 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl">
                    <h2 className="text-base font-semibold text-white mb-4">Form Audit Stock Opname</h2>
                    {currentRole === 'qc' ? (
                      <div className="bg-amber-950/40 border border-amber-500/30 p-4 rounded-xl text-xs text-amber-300 text-center">
                        Akun QC / Checker bertugas melakukan verifikasi (*Check*) serta dapat langsung menginput Qty Checker pada tabel sebelah kanan.
                      </div>
                    ) : (
                      <form onSubmit={handleAddAuditLog} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">1. Zona / Lokasi</label>
                          <select value={selectedZone} onChange={(e) => setSelectedZone(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                            {defaultZones.map(z => <option key={z} value={z}>{z}</option>)}
                          </select>
                        </div>

                        <div className="relative">
                          <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">2. SKU Variasi Barang</label>
                          <input type="text" placeholder="Cari Kode SKU / Nama..." value={skuInput} onChange={(e) => { setSkuInput(e.target.value); setSelectedSkuObj(null); setShowSuggestions(true); }} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                          {showSuggestions && skuSuggestions.length > 0 && (
                            <div className="absolute z-30 left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-60 overflow-y-auto divide-y divide-slate-800">
                              {skuSuggestions.map(item => (
                                <div key={item.id} onClick={() => handleSelectSku(item)} className="p-2.5 hover:bg-slate-800 cursor-pointer text-xs flex justify-between">
                                  <div>
                                    <p className="font-mono font-semibold text-blue-400">{item.sku}</p>
                                    <p className="text-slate-300">{item.name}</p>
                                  </div>
                                  <div className="text-emerald-400 font-semibold">{item.systemQty} Pcs</div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                        {/* Input Qty Auditor & Qty Checker */}
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">3. Qty Auditor</label>
                            <input type="number" step="any" placeholder="Qty" value={inputQty} onChange={(e) => setInputQty(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono font-bold text-white" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase text-amber-300 mb-1">Qty Checker</label>
                            <input type="number" step="any" placeholder="Opsional" value={checkerQty} onChange={(e) => setCheckerQty(e.target.value)} className="w-full bg-slate-900 border border-amber-500/40 rounded-xl px-3 py-2.5 text-sm font-mono font-bold text-white" />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Satuan & Konversi Koli</label>
                          <div className="flex items-center space-x-2">
                            <select value={unit} onChange={(e) => setUnit(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-semibold text-white">
                              <option value="Pcs">Pcs</option>
                              <option value="Koli">Koli</option>
                            </select>
                            <div className="flex-1 flex items-center justify-between text-xs text-slate-400 bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                              <span>1 Koli =</span>
                              <input type="number" value={conversionRatio} onChange={(e) => setConversionRatio(Math.max(1, parseInt(e.target.value) || 1))} className="w-16 bg-slate-800 border border-slate-700 rounded text-center py-1 text-xs text-white font-mono" />
                              <span>Pcs</span>
                            </div>
                          </div>
                          {inputQty > 0 && (
                            <div className="mt-2 bg-emerald-950/30 border border-emerald-500/30 rounded-xl p-2.5 text-xs text-emerald-300">
                              <span className="font-mono text-xs font-bold text-white">{convertedValues.displayText}</span>
                            </div>
                          )}
                        </div>

                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Catatan Opname</label>
                          <input type="text" placeholder="Catatan opsional" value={auditorNote} onChange={(e) => setAuditorNote(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                        </div>

                        <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-600/30 transition-all">Simpan Audit (Cloud Sync)</button>
                      </form>
                    )}
                  </div>

                  <div className="lg:col-span-7 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl flex flex-col">
                    <h3 className="text-base font-semibold text-white mb-4">Daftar Hasil Record Opname ({auditLogs.length})</h3>
                    {auditLogs.length === 0 ? (
                      <div className="flex-1 flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-slate-700 rounded-xl my-4">
                        <p className="text-slate-400 font-medium">Belum ada data fisik yang di-input</p>
                      </div>
                    ) : (
                      <div className="flex-1 overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-900/80 text-slate-400 font-mono uppercase border-b border-slate-700">
                            <tr>
                              <th className="p-3">Waktu & Zona</th>
                              <th className="p-3">SKU & Author</th>
                              <th className="p-3 text-right">Qty Auditor</th>
                              <th className="p-3 text-right">Qty Checker</th>
                              <th className="p-3 text-center">QC Check</th>
                              <th className="p-3 text-center">ACC Koordinator</th>
                              <th className="p-3 text-center">Aksi</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {auditLogs.map(log => (
                              <tr key={log.id} className="hover:bg-slate-700/30">
                                <td className="p-3"><span className="font-semibold text-slate-200">{log.zone}</span><span className="block text-[10px] text-slate-400">{log.timestamp}</span></td>
                                <td className="p-3">
                                  <span className="font-mono text-blue-400 font-semibold block">{log.sku}</span>
                                  <span className="text-slate-300 text-[11px]">{log.name}</span>
                                  <span className="block text-[10px] text-indigo-400 mt-0.5">By: {log.auditorName}</span>
                                </td>
                                <td className="p-3 text-right font-mono">
                                  <div className="text-white font-bold">{log.inputQty} {log.unit}</div>
                                  <div className="text-emerald-400 text-[11px]">{log.pcsQty} Pcs</div>
                                </td>
                                <td className="p-3 text-right font-mono">
                                  <input 
                                    type="number" 
                                    step="any" 
                                    value={log.checkerQty !== undefined ? log.checkerQty : ''} 
                                    onChange={(e) => handleUpdateCheckerQtyInline(log.id, e.target.value, log.sku)}
                                    placeholder="0"
                                    className="w-16 bg-slate-900 border border-amber-500/40 text-amber-300 font-bold text-right rounded p-1 text-xs"
                                  />
                                </td>
                                <td className="p-3 text-center">
                                  <button 
                                    onClick={() => handleQcUpdate(log.id, log.qcName, log.sku)} 
                                    className={`px-2 py-1 rounded text-[10px] font-bold transition-all ${log.qcName !== '-' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700'}`}
                                  >
                                    {log.qcName !== '-' ? `Checked (${log.qcName})` : 'Mark QC'}
                                  </button>
                                </td>
                                <td className="p-3 text-center">
                                  <button 
                                    onClick={() => handleAccLog(log.id, log.accStatus, log.sku)} 
                                    disabled={currentRole !== 'koordinator'}
                                    className={`px-2.5 py-1 rounded text-[10px] font-bold transition-all ${currentRole !== 'koordinator' ? 'opacity-60 cursor-not-allowed bg-slate-800 text-slate-500' : log.accStatus === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500/20'}`}
                                  >
                                    {log.accStatus === 'APPROVED' ? 'APPROVED ✓' : 'PENDING ACC'}
                                  </button>
                                </td>
                                <td className="p-3 text-center">
                                  <button 
                                    onClick={() => handleDeleteAuditLog(log.id, log.auditorName, log.sku)} 
                                    disabled={currentRole === 'qc'}
                                    className={`p-1.5 rounded-lg text-[10px] transition-all ${currentRole === 'qc' ? 'opacity-30 cursor-not-allowed bg-slate-800 text-slate-500' : 'bg-rose-500/10 text-rose-400 hover:bg-rose-500/30'}`}
                                  >
                                    Hapus
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>

                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-base font-bold text-white">Histori Aksi & Timeline Audit</h3>
                      <p className="text-xs text-slate-400">Log aktivitas penambahan SKU, penghapusan data, ACC QC, dan ACC Koordinator</p>
                    </div>
                    <span className="bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold">
                      {actionHistory.length} Log Aksi
                    </span>
                  </div>

                  {actionHistory.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-500 border border-dashed border-slate-700 rounded-xl">
                      Belum ada histori aksi yang terekam pada sesi ini
                    </div>
                  ) : (
                    <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1 divide-y divide-slate-800">
                      {actionHistory.map(hist => (
                        <div key={hist.id} className="pt-2.5 flex items-start justify-between text-xs">
                          <div className="flex items-start space-x-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase mt-0.5 ${
                              hist.type === 'TAMBAH_SKU' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' :
                              hist.type === 'HAPUS_SKU' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' :
                              hist.type.includes('ACC_QC') ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' :
                              'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                            }`}>
                              {hist.type.replace(/_/g, ' ')}
                            </span>
                            <div>
                              <span className="font-mono font-bold text-slate-200">{hist.sku}</span>
                              <p className="text-slate-400 text-[11px]">{hist.details}</p>
                            </div>
                          </div>
                          <div className="text-right">
                            <span className="text-[10px] text-slate-400 block">{hist.timestamp}</span>
                            <span className="text-[10px] font-semibold text-slate-300">By: {hist.actor} ({hist.role.toUpperCase()})</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'todos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {currentRole === 'koordinator' && (
                  <div className="lg:col-span-4 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4">
                    <h3 className="text-base font-bold text-white mb-2">Buat & Beri Task To-Do Baru</h3>
                    <form onSubmit={handleCreateTask} className="space-y-3">
                      <div>
                        <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">1. Nama Task</label>
                        <input type="text" placeholder="misal: Cek Barcode Rak A1" value={taskTitle} onChange={(e) => setTaskTitle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">2. Deskripsi Task</label>
                        <textarea placeholder="Instruksi rinci..." value={taskDesc} onChange={(e) => setTaskDesc(e.target.value)} rows="2" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"></textarea>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Priority</label>
                          <select value={taskPriority} onChange={(e) => setTaskPriority(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <option value="High">🔴 High</option>
                            <option value="Medium">🟡 Medium</option>
                            <option value="Low">🟢 Low</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Target Selesai</label>
                          <input type="date" value={taskDueDate} onChange={(e) => setTaskDueDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Kategori</label>
                          <select value={taskCategory} onChange={(e) => setTaskCategory(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <option value="Harian">Harian</option>
                            <option value="Mingguan">Mingguan</option>
                            <option value="Bulanan">Bulanan</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Tugaskan Ke</label>
                          <select value={taskAssignedTo} onChange={(e) => setTaskAssignedTo(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <option value="Semua Tim">Semua Tim</option>
                            {accounts.map(acc => (
                              <option key={acc.key} value={acc.name}>{acc.name} ({acc.role.toUpperCase()})</option>
                            ))}
                          </select>
                        </div>
                      </div>
                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl shadow-lg transition-all text-xs mt-2">+ Berikan Task ke Tim</button>
                    </form>
                  </div>
                )}

                <div className={`${currentRole === 'koordinator' ? 'lg:col-span-8' : 'lg:col-span-12'} space-y-4`}>
                  <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                      <h2 className="text-base font-bold text-white">Audit Task & Planning Schedule</h2>
                      <p className="text-xs text-slate-400">Tim dapat melihat daftar tugas dan mencentang task yang telah selesai</p>
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                      <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                        {['Harian', 'Mingguan', 'Bulanan'].map(p => (
                          <button key={p} onClick={() => setTodoPeriod(p)} className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition-all ${todoPeriod === p ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>{p}</button>
                        ))}
                      </div>
                      <button onClick={() => setTodoPrioritySort(prev => prev === 'DESC' ? 'ASC' : 'DESC')} className="bg-slate-900 hover:bg-slate-700 text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-700 text-indigo-300">
                        Urut Priority: {todoPrioritySort === 'DESC' ? 'High → Low' : 'Low → High'}
                      </button>
                    </div>
                  </div>

                  {sortedFilteredTodos.length === 0 ? (
                    <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-8 text-center text-xs text-slate-400">Tidak ada task {todoPeriod.toLowerCase()} yang tersedia</div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {sortedFilteredTodos.map(task => (
                        <div key={task.id} className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 text-white shadow-lg flex flex-col justify-between space-y-3">
                          <div>
                            <div className="flex items-start justify-between gap-2">
                              <div className="flex items-start space-x-2">
                                <input type="checkbox" checked={task.completed} onChange={() => handleToggleTask(task.id, task.completed)} className="w-4 h-4 accent-blue-600 mt-1 cursor-pointer" />
                                <h4 className={`text-sm font-semibold leading-tight ${task.completed ? 'line-through text-slate-500' : 'text-white'}`}>{task.title}</h4>
                              </div>
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${task.priority === 'High' ? 'bg-rose-500/20 text-rose-300' : task.priority === 'Medium' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}`}>{task.priority}</span>
                            </div>
                            <p className="text-xs text-slate-400 mt-2 pl-6 leading-relaxed">{task.description}</p>
                          </div>
                          <div className="pt-2 border-t border-slate-700/60 flex justify-between items-center text-[11px] text-slate-400">
                            <div>
                              <span>Target: <strong className="text-slate-200">{task.dueDate}</strong></span>
                              <span className="block text-indigo-300">Untuk: {task.assignedTo || 'Semua Tim'}</span>
                            </div>
                            {currentRole === 'koordinator' && (
                              <button onClick={() => handleDeleteTask(task.id)} className="text-rose-400 hover:text-rose-300 font-semibold">Hapus</button>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">Total SKU</div>
                    <div className="text-2xl font-mono font-bold text-blue-400">{reconciliationData.totalSkusCount} SKU</div>
                  </div>
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">Total System Qty</div>
                    <div className="text-2xl font-mono font-bold text-white">{reconciliationData.totalSystemPcs.toLocaleString()} Pcs</div>
                  </div>
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">Total Fisik (Audited)</div>
                    <div className="text-2xl font-mono font-bold text-emerald-400">{reconciliationData.totalAuditedPcs.toLocaleString()} Pcs</div>
                  </div>
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">Net Selisih (Varian)</div>
                    <div className={`text-2xl font-mono font-bold ${reconciliationData.netDiscrepancy < 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                      {reconciliationData.netDiscrepancy > 0 ? `+${reconciliationData.netDiscrepancy}` : reconciliationData.netDiscrepancy} Pcs
                    </div>
                  </div>
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">SKU Bermasalah</div>
                    <div className="text-2xl font-mono font-bold text-amber-400">{reconciliationData.totalDiscrepanciesCount} SKU</div>
                  </div>
                </div>

                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h3 className="text-sm font-semibold text-white">Tabel Perbandingan Stok System vs Stok Fisik</h3>
                    <div className="w-full sm:w-72">
                      <input type="text" placeholder="Cari SKU Variasi / Nama..." value={dashboardSearch} onChange={(e) => setDashboardSearch(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-900 text-slate-400 uppercase font-mono border-b border-slate-700">
                        <tr>
                          <th className="p-3">SKU Variasi</th>
                          <th className="p-3">Nama & Detail Produk</th>
                          <th className="p-3 text-right cursor-pointer" onClick={() => handleSort('systemQty')}>System Qty</th>
                          <th className="p-3 text-right cursor-pointer" onClick={() => handleSort('physicalQty')}>Fisik (Pcs)</th>
                          <th className="p-3 text-right cursor-pointer" onClick={() => handleSort('discrepancyPcs')}>Selisih Pcs</th>
                          <th className="p-3 text-center cursor-pointer" onClick={() => handleSort('status')}>Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {reconciliationData.items.map(item => (
                          <tr key={item.id} className="hover:bg-slate-700/30">
                            <td className="p-3 font-mono font-bold text-blue-400">{item.sku}</td>
                            <td className="p-3 text-slate-300">{item.name}</td>
                            <td className="p-3 text-right font-mono text-white">{item.systemQty} Pcs</td>
                            <td className="p-3 text-right font-mono text-emerald-400 font-bold">{item.physicalQty} Pcs</td>
                            <td className="p-3 text-right font-mono font-bold"><span className={item.discrepancyPcs < 0 ? 'text-rose-400' : item.discrepancyPcs > 0 ? 'text-amber-400' : 'text-slate-400'}>{item.discrepancyPcs > 0 ? `+${item.discrepancyPcs}` : item.discrepancyPcs}</span></td>
                            <td className="p-3 text-center"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${item.status === 'MATCHED' ? 'bg-emerald-500/20 text-emerald-300' : item.status === 'SHORTAGE' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'}`}>{item.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'export' && currentRole === 'koordinator' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="flex bg-slate-800/90 border border-slate-700/80 p-1.5 rounded-2xl shadow-xl">
                  <button onClick={() => setExportSubTab('upload')} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all ${exportSubTab === 'upload' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Upload & Template Excel</button>
                  <button onClick={() => setExportSubTab('history')} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all ${exportSubTab === 'history' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Histori Import File ({importHistory.length})</button>
                </div>

                {exportSubTab === 'upload' ? (
                  <>
                    <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
                      <div className="flex items-center justify-between mb-4">
                        <div>
                          <h2 className="text-base font-bold text-white">Download Template Excel Native (.xls / .xlsx)</h2>
                          <p className="text-xs text-slate-400">Unduh file template berformat rapi</p>
                        </div>
                        <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold">
                          {masterStock.length} SKU Master Tersedia
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                        <div className="bg-slate-900/80 border border-indigo-500/30 rounded-xl p-4 flex flex-col justify-between">
                          <div>
                            <span className="text-indigo-300 text-xs font-bold block mb-2">Template 1: Data Master Baru</span>
                          </div>
                          <button onClick={handleDownloadMasterTemplate} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Template Master</button>
                        </div>

                        <div className="bg-slate-900/80 border border-blue-500/30 rounded-xl p-4 flex flex-col justify-between">
                          <div>
                            <span className="text-blue-300 text-xs font-bold block mb-2">Template 2: Qty Stok</span>
                          </div>
                          <button onClick={handleDownloadQtyTemplate} className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Template Qty</button>
                        </div>

                        <div className="bg-slate-900/80 border border-emerald-500/30 rounded-xl p-4 flex flex-col justify-between">
                          <div>
                            <span className="text-emerald-300 text-xs font-bold block mb-2">Template 3: Master Sync & Hapus</span>
                          </div>
                          <button onClick={handleDownloadMasterSyncTemplate} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Template Sync/Hapus</button>
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl relative">
                      <h2 className="text-base font-bold text-white mb-2">Import File Excel</h2>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700 mb-4">
                        <button onClick={() => setImportMode('master')} className={`py-2 px-2 text-[11px] font-semibold rounded-lg transition-all ${importMode === 'master' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>1. Import Data Master Baru</button>
                        <button onClick={() => setImportMode('qty')} className={`py-2 px-2 text-[11px] font-semibold rounded-lg transition-all ${importMode === 'qty' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>2. Import Qty Stok Saja</button>
                        <button onClick={() => setImportMode('sync_delete')} className={`py-2 px-2 text-[11px] font-semibold rounded-lg transition-all ${importMode === 'sync_delete' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>3. Sync & Hapus SKU Master</button>
                      </div>

                      <div className="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center hover:border-blue-500 transition-colors">
                        <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" id="excel-upload-input" />
                        <label htmlFor="excel-upload-input" className="cursor-pointer flex flex-col items-center">
                          <span className="text-sm font-semibold text-blue-400">Upload Excel</span>
                          <span className="text-xs text-slate-500 mt-1">Format .xlsx, .xls, atau .csv didukung</span>
                        </label>
                      </div>

                      {isProcessingFile && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center space-y-3">
                            <h3 className="text-base font-bold text-white">Proses Upload Excel ke Cloud</h3>
                            <p className="text-xs text-slate-400">{uploadStatusMsg}</p>
                            <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                              <div className="bg-blue-600 h-full rounded-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
                            </div>
